use_cases: "### 11.1. Actor và nhóm use case\n\n | Mã actor | Actor | Mô tả |\n\n |---|---|---|\n\n | A01 | Customer (Khách\
  \ hàng) | Tạo chuyến, chọn loại xe, theo dõi chuyến, thanh toán và đánh giá. |\n\n | A02 | Driver (Tài xế) | Cập nhật sẵn\
  \ sàng, nhận/từ chối chuyến, thực hiện và hoàn tất chuyến. |\n\n | A03 | Operations staff | Theo dõi chuyến, hỗ trợ khách/tài\
  \ xế và xử lý khiếu nại. |\n\n | A04 | System administrator | Quản lý tài khoản, tài xế, xe, cấu hình và báo cáo. |\n\n\
   | A05 | Payment gateway | Xác nhận hoặc từ chối giao dịch trực tuyến. |\n\n | A06 | Map/Location service | Cung cấp bản\
  \ đồ, tọa độ, khoảng cách và định tuyến. |\n\n Trong tài liệu này, \\`Customer\\` là actor A01; mã \\`UC01\\` là use case\
  \ **\\*\\*Đặt chuyến\\*\\*** mà Customer khởi tạo. Một use case là một mục tiêu hoàn chỉnh của actor, còn các bước xử lý\
  \ bên trong được mô tả ở phần đặc tả.\n\n### 11.2. Use case diagram\n\n \\`\\`\\`mermaid\n\n flowchart LR\n\n     Customer[\"\
  A01 Customer\"]\n\n     Driver[\"A02 Driver\"]\n\n     Operations[\"A03 Operations staff\"]\n\n     Admin[\"A04 System administrator\"\
  ]\n\n     Payment[\"A05 Payment gateway\"]\n\n     Map[\"A06 Map/Location service\"]\n\n     subgraph CABRide[\"CAB SYSTEM\"\
  ]\n\n         UC01((\"UC01 Đặt chuyến\"))\n\n         UC02((\"UC02 Tìm và nhận chuyến\"))\n\n         UC03((\"UC03 Theo\
  \ dõi chuyến\"))\n\n         UC04((\"UC04 Thực hiện và hoàn tất chuyến\"))\n\n         UC05((\"UC05 Thanh toán chuyến\"\
  ))\n\n         UC06((\"UC06 Hủy chuyến\"))\n\n         UC07((\"UC07 Đánh giá tài xế\"))\n\n         UC08((\"UC08 Quản lý\
  \ tài khoản và cấu hình\"))\n\n         UC09((\"UC09 Hỗ trợ và xử lý sự cố\"))\n\n     end\n\n     Customer --> UC01\n\n\
       Customer --> UC03\n\n     Customer --> UC05\n\n     Customer --> UC06\n\n     Customer --> UC07\n\n     Driver -->\
  \ UC02\n\n     Driver --> UC03\n\n     Driver --> UC04\n\n     Driver --> UC06\n\n     Payment --> UC05\n\n     Map -->\
  \ UC01\n\n     Map --> UC03\n\n     Operations --> UC03\n\n     Operations --> UC09\n\n     Admin --> UC08\n\n     UC01\
  \ -. \"include\" .-> UC03\n\n     UC01 -. \"include\" .-> UC02\n\n     UC04 -. \"include\" .-> UC05\n\n     UC04 -. \"extend\"\
  \ .-> UC07\n\n     UC01 -. \"extend\" .-> UC06\n\n \\`\\`\\`\n\n### 11.3. Danh sách use case\n\n | Mã | Tên use case | Actor\
  \ chính | Kết quả thành công |\n\n |---|---|---|---|\n\n | UC01 | Đặt chuyến | Customer | Tạo chuyến ở trạng thái \\`SEARCHING\\\
  _DRIVER\\`. |\n\n | UC02 | Tìm và nhận chuyến | Driver | Một tài xế phù hợp nhận chuyến ở trạng thái \\`DRIVER\\_ASSIGNED\\\
  `. |\n\n | UC03 | Theo dõi chuyến | Customer, Driver | Hai bên xem được trạng thái, vị trí và thông tin chuyến. |\n\n |\
  \ UC04 | Thực hiện và hoàn tất chuyến | Driver | Chuyến chuyển sang \\`COMPLETED\\` và có giá cuối. |\n\n | UC05 | Thanh\
  \ toán chuyến | Customer, Payment gateway | Giao dịch ở \\`PAID\\` hoặc được ghi nhận là tiền mặt cần thu. |\n\n | UC06\
  \ | Hủy chuyến | Customer, Driver | Chuyến được hủy theo đúng điều kiện và chính sách phí. |\n\n | UC07 | Đánh giá tài xế\
  \ | Customer | Lưu điểm đánh giá và phản hồi sau chuyến. |\n\n | UC08 | Quản lý tài khoản và cấu hình | System administrator\
  \ | Dữ liệu tài khoản, loại xe và chính sách được cập nhật. |\n\n | UC09 | Hỗ trợ và xử lý sự cố | Operations staff | Sự\
  \ cố được ghi nhận, xử lý và có lịch sử truy vết. |\n\n### 11.3.1. Use Case Priority Matrix\n\n```mermaid\nquadrantChart\n\
  \    title Use Case Priority Matrix\n    x-axis \"Độ phức tạp thấp\" --> \"Độ phức tạp cao\"\n    y-axis \"Giá trị người\
  \ dùng thấp\" --> \"Giá trị người dùng cao\"\n    quadrant-1 \"Lập kế hoạch kỹ\"\n    quadrant-2 \"Ưu tiên MVP\"\n    quadrant-3\
  \ \"Có thể để sau\"\n    quadrant-4 \"Tối ưu\"\n    UC01 Đặt chuyến: [0.58, 0.98]\n    UC02 Tìm nhận chuyến: [0.70, 0.94]\n\
  \    UC03 Theo dõi: [0.55, 0.88]\n    UC04 Hoàn tất: [0.48, 0.90]\n    UC05 Thanh toán: [0.65, 0.92]\n    UC06 Hủy: [0.40,\
  \ 0.70]\n    UC07 Đánh giá: [0.32, 0.58]\n    UC08 Quản trị: [0.72, 0.62]\n    UC09 Hỗ trợ: [0.60, 0.74]\n```\n\n### 11.4.\
  \ Đặc tả UC01 - Đặt chuyến\n\n | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC01 - Đặt chuyến |\n\n | Actor chính\
  \ | A01 Customer |\n\n | Actor phụ | A06 Map/Location service |\n\n | Mục tiêu | Tạo một yêu cầu di chuyển với điểm đón,\
  \ điểm đến, loại xe và phương thức thanh toán. |\n\n | Tiền điều kiện | Customer đã đăng nhập; dịch vụ bản đồ đang hoạt\
  \ động; tài khoản không bị khóa. |\n\n | Kích hoạt | Customer chọn chức năng đặt xe. |\n\n | Hậu điều kiện thành công |\
  \ Tạo một \\`Ride\\`, tính giá dự kiến và chuyển sang \\`SEARCHING\\_DRIVER\\`. |\n\n | Hậu điều kiện thất bại | Không tạo\
  \ chuyến hợp lệ; hiển thị nguyên nhân để Customer sửa hoặc thoát. |\n\n **\\*\\*Luồng chính:\\*\\***\n\n 1. Customer nhập\
  \ hoặc chọn điểm đón.\n\n 2. Hệ thống lấy tọa độ từ dịch vụ bản đồ và hiển thị điểm đón.\n\n 3. Customer nhập điểm đến.\n\
  \n 4. Hệ thống tính khoảng cách, thời gian và giá dự kiến.\n\n 5. Customer chọn \\`BIKE\\` hoặc \\`CAR\\`, phương thức thanh\
  \ toán và xác nhận.\n\n 6. Hệ thống kiểm tra dữ liệu, chống tạo trùng và tạo \\`Ride\\`.\n\n 7. Hệ thống chuyển sang UC02\
  \ để tìm tài xế và hiển thị trạng thái cho Customer.\n\n **\\*\\*Luồng thay thế/ngoại lệ:\\*\\***\n\n - A1: Điểm đón hoặc\
  \ điểm đến không xác định được: thông báo lỗi, quay lại bước nhập địa điểm.\n\n - A2: Hai điểm không hợp lệ hoặc trùng nhau:\
  \ không cho xác nhận chuyến.\n\n - A3: Không có loại xe trong khu vực: thông báo và cho phép chọn loại xe khác.\n\n - A4:\
  \ Customer bấm xác nhận nhiều lần: chỉ tạo một \\`Ride\\` theo khóa yêu cầu duy nhất.\n\n - A5: Mất mạng: lưu trạng thái\
  \ ở máy chủ; khi kết nối lại tải trạng thái cuối, không tạo chuyến trùng.\n\n### 11.5. Đặc tả UC02 - Tìm và nhận chuyến\n\
  \n | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC02 - Tìm và nhận chuyến |\n\n | Actor chính | Hệ thống và A02\
  \ Driver |\n\n | Tiền điều kiện | UC01 đã tạo chuyến; Customer chưa hủy; có dữ liệu vị trí tài xế gần nhất. |\n\n | Hậu\
  \ điều kiện thành công | Một Driver được gán; chuyến chuyển sang \\`DRIVER\\_ASSIGNED\\`. |\n\n | Hậu điều kiện thất bại\
  \ | Hết 3 phút hoặc hết danh sách; chuyến chuyển sang \\`NO\\_DRIVER\\`. |\n\n **\\*\\*Luồng chính:\\*\\***\n\n 1. Hệ thống\
  \ lọc Driver có \\`availability\\_status = AVAILABLE\\` trong bán kính 5 km.\n\n 2. Hệ thống lọc tiếp theo loại xe Customer\
  \ chọn.\n\n 3. Nếu Customer bật ưu tiên, hệ thống xếp tài xế có đánh giá cao hơn; sau đó ưu tiên khoảng cách gần hơn.\n\n\
   4. Hệ thống gửi yêu cầu cho tài xế phù hợp; mỗi yêu cầu có thời hạn 30 giây.\n\n 5. Driver chọn nhận chuyến; hệ thống khóa\
  \ chuyến và cập nhật Driver sang trạng thái bận.\n\n 6. Hệ thống thông báo thông tin Driver cho Customer và chuyển sang\
  \ UC03.\n\n **\\*\\*Luồng thay thế/ngoại lệ:\\*\\***\n\n - B1: Driver từ chối hoặc không phản hồi trong 30 giây: ghi nhận\
  \ \\`DECLINED\\`/\\`EXPIRED\\`, gửi Driver tiếp theo.\n\n - B2: Driver mất trạng thái \\`AVAILABLE\\` trước khi nhận: bỏ\
  \ qua Driver và tìm lại.\n\n - B3: Không còn Driver phù hợp: tiếp tục tìm đến tối đa 3 phút, sau đó báo Customer và đóng\
  \ ở \\`NO\\_DRIVER\\`.\n\n - B4: Hai yêu cầu cùng tranh một chuyến: chỉ yêu cầu đầu tiên hợp lệ được chấp nhận, yêu cầu\
  \ còn lại nhận lỗi đã có tài xế.\n\n### 11.6. Đặc tả UC03 - Theo dõi chuyến\n\n | Thuộc tính | Nội dung |\n\n |---|---|\n\
  \n | Mã/tên | UC03 - Theo dõi chuyến |\n\n | Actor chính | A01 Customer, A02 Driver |\n\n | Tiền điều kiện | Có \\`Ride\\\
  ` thuộc về actor và actor đã được phân quyền xem. |\n\n | Luồng chính | Hiển thị tài xế/khách, biển số, điểm đón, điểm đến,\
  \ trạng thái và vị trí cập nhật. |\n\n | Hậu điều kiện | Trạng thái hiển thị khớp dữ liệu mới nhất trên máy chủ. |\n\n Các\
  \ trạng thái hợp lệ: \\`SEARCHING\\_DRIVER\\` -> \\`DRIVER\\_ASSIGNED\\` -> \\`DRIVER\\_ARRIVING\\` -> \\`IN\\_PROGRESS\\\
  ` -> \\`COMPLETED\\`. Từ \\`SEARCHING\\_DRIVER\\` hoặc \\`DRIVER\\_ASSIGNED\\` có thể chuyển sang \\`CANCELLED\\` theo UC06.\n\
  \n### 11.7. Đặc tả UC04 - Thực hiện và hoàn tất chuyến\n\n | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC04 -\
  \ Thực hiện và hoàn tất chuyến |\n\n | Actor chính | A02 Driver |\n\n | Tiền điều kiện | Driver đã được gán cho Ride. |\n\
  \n | Luồng chính | Driver báo đã đến điểm đón; bắt đầu chuyến khi đón khách; di chuyển; chọn hoàn tất khi đến điểm đến.\
  \ |\n\n | Hậu điều kiện | Lưu quãng đường/thời gian, tính giá cuối và chuyển sang UC05. |\n\n | Ngoại lệ | Chỉ Driver được\
  \ gán mới được đổi trạng thái; không cho hoàn tất khi chưa bắt đầu. |\n\n### 11.8. Đặc tả UC05 - Thanh toán chuyến\n\n |\
  \ Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC05 - Thanh toán chuyến |\n\n | Actor chính | A01 Customer |\n\n\
   | Actor phụ | A05 Payment gateway |\n\n | Tiền điều kiện | UC04 đã hoàn tất và hệ thống có giá cuối. |\n\n | Luồng tiền\
  \ mặt | Customer chọn tiền mặt; hệ thống ghi \\`CASH\\_PENDING\\`; Driver xác nhận đã thu tiền; chuyển \\`PAID\\`. |\n\n\
   | Luồng trực tuyến | Hệ thống tạo giao dịch; gateway trả kết quả; callback hợp lệ chuyển giao dịch sang \\`PAID\\`. |\n\
  \n | Ngoại lệ | Giao dịch thất bại thì ghi \\`FAILED\\`, thông báo Customer và cho phép thử lại hoặc chọn tiền mặt theo\
  \ chính sách. |\n\n### 11.9. Đặc tả UC06 - Hủy chuyến\n\n | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC06 -\
  \ Hủy chuyến |\n\n | Actor chính | Customer hoặc Driver |\n\n | Tiền điều kiện | Chuyến chưa ở \\`COMPLETED\\` và người\
  \ yêu cầu có quyền hủy. |\n\n | Luồng chính | Actor chọn hủy, chọn lý do; hệ thống kiểm tra trạng thái, tính phí nếu có,\
  \ thông báo bên còn lại và chuyển \\`CANCELLED\\`. |\n\n | Ngoại lệ | Không cho hủy chuyến đã hoàn tất; nếu Driver hủy thì\
  \ quay lại UC02 tìm Driver khác trước khi đóng chuyến. |\n\n### 11.10. Đặc tả UC07 - Đánh giá tài xế\n\n | Thuộc tính |\
  \ Nội dung |\n\n |---|---|\n\n | Mã/tên | UC07 - Đánh giá tài xế |\n\n | Actor chính | A01 Customer |\n\n | Tiền điều kiện\
  \ | Ride ở \\`COMPLETED\\`; Customer là người đặt chuyến; chưa đánh giá Ride này. |\n\n | Luồng chính | Customer chọn 1-5\
  \ sao, nhập phản hồi tùy chọn; hệ thống kiểm tra và lưu Rating, sau đó cập nhật điểm trung bình Driver. |\n\n | Ngoại lệ\
  \ | Không cho đánh giá nhiều lần, điểm ngoài 1-5 hoặc đánh giá chuyến không thuộc Customer. |\n\n### 11.11. Truy vết liên\
  \ tục BR - FR - UC\n\n | Business requirement | Functional requirements liên quan | Use case thực hiện |\n\n |---|---|---|\n\
  \n | BR01 Đặt chuyến | FR01-FR04 | UC01, UC03 |\n\n | BR02 Tìm và phân công tài xế | FR05-FR09 | UC02 |\n\n | BR03 Quản\
  \ lý trạng thái chuyến | FR10-FR11 | UC03, UC04, UC06 |\n\n | BR04 Thanh toán chuyến | FR12-FR13 | UC04, UC05 |\n\n | BR05\
  \ Đánh giá và phản hồi | FR14-FR15 | UC07, UC09 |"

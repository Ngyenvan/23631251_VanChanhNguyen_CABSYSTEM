openapi: 3.0.3
info:
  title: CAB SYSTEM - Rides API
  version: 1.0.0
  description: API tính giá, tạo, theo dõi, cập nhật và hủy chuyến.
servers:
  - url: https://api.cabsystem.example.com/v1
    description: Production server
tags:
  - name: Rides
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    RideId:
      name: ride_id
      in: path
      required: true
      schema: {type: integer, example: 3001}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, example: req-20260903-0001}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: INVALID_STATUS_TRANSITION}
        message: {type: string, example: Chuyển trạng thái không hợp lệ}
    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address: {type: string, example: '1 Nguyen Hue, District 1'}
        latitude: {type: number, format: double, example: 10.7743}
        longitude: {type: number, format: double, example: 106.704}
    RideEstimateRequest:
      type: object
      required: [pickup, destination, vehicle_type]
      properties:
        pickup: {$ref: '#/components/schemas/Location'}
        destination: {$ref: '#/components/schemas/Location'}
        vehicle_type: {type: string, enum: [BIKE, CAR], example: CAR}
    RideEstimate:
      type: object
      required: [distance_km, estimated_duration_minutes, estimated_fare, currency]
      properties:
        distance_km: {type: number, example: 7.2}
        estimated_duration_minutes: {type: integer, example: 25}
        estimated_fare: {type: number, example: 95000}
        currency: {type: string, example: VND}
    CreateRideRequest:
      allOf:
        - $ref: '#/components/schemas/RideEstimateRequest'
        - type: object
          required: [request_id, payment_method]
          properties:
            request_id: {type: string, example: req-20260903-0001}
            payment_method: {type: string, enum: [CASH, ONLINE], example: CASH}
            prefer_high_rating_driver: {type: boolean, default: false, example: true}
    Ride:
      type: object
      required: [ride_id, customer_id, status, estimated_fare, created_at]
      properties:
        ride_id: {type: integer, example: 3001}
        customer_id: {type: integer, example: 101}
        pickup: {$ref: '#/components/schemas/Location'}
        destination: {$ref: '#/components/schemas/Location'}
        vehicle_type: {type: string, enum: [BIKE, CAR], example: CAR}
        status: {type: string, enum: [SEARCHING_DRIVER, DRIVER_ASSIGNED, DRIVER_ARRIVING, IN_PROGRESS, COMPLETED, CANCELLED, NO_DRIVER], example: SEARCHING_DRIVER}
        estimated_fare: {type: number, example: 95000}
        final_fare: {type: number, nullable: true, example: 102000}
        created_at: {type: string, format: date-time, example: '2026-09-03T10:00:00Z'}
        updated_at: {type: string, format: date-time, example: '2026-09-03T10:20:00Z'}
    RideStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [DRIVER_ARRIVING, IN_PROGRESS, COMPLETED], example: DRIVER_ARRIVING}
        final_fare: {type: number, description: Bắt buộc khi COMPLETED, example: 102000}
        actual_distance_km: {type: number, description: Bắt buộc khi COMPLETED, example: 7.8}
    CancelRideRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, example: Thay đổi kế hoạch}
    RideList:
      type: object
      properties:
        page: {type: integer, example: 1}
        limit: {type: integer, example: 20}
        total: {type: integer, example: 1}
        items: {type: array, items: {$ref: '#/components/schemas/Ride'}}
paths:
  /rides/estimate:
    post:
      tags: [Rides]
      summary: Tính giá và thông tin chuyến dự kiến
      operationId: estimateRide
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RideEstimateRequest'}}}
      responses:
        '200':
          description: Tính giá dự kiến thành công
          content: {application/json: {schema: {$ref: '#/components/schemas/RideEstimate'}}}
        '400':
          description: Địa điểm hoặc loại xe không hợp lệ
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /rides:
    post:
      tags: [Rides]
      summary: Tạo chuyến và bắt đầu tìm tài xế
      operationId: createRide
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateRideRequest'}}}
      responses:
        '201':
          description: Tạo chuyến thành công ở SEARCHING_DRIVER
          content: {application/json: {schema: {$ref: '#/components/schemas/Ride'}}}
        '400':
          description: Dữ liệu chuyến không hợp lệ
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Yêu cầu trùng hoặc khách có chuyến hoạt động
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    get:
      tags: [Rides]
      summary: Xem lịch sử chuyến của khách hàng
      operationId: listCustomerRides
      security: [{bearerAuth: []}]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [SEARCHING_DRIVER, DRIVER_ASSIGNED, DRIVER_ARRIVING, IN_PROGRESS, COMPLETED, CANCELLED, NO_DRIVER]}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách chuyến
          content: {application/json: {schema: {$ref: '#/components/schemas/RideList'}}}
        '401':
          description: Chưa xác thực
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /rides/{ride_id}:
    get:
      tags: [Rides]
      summary: Xem chi tiết và theo dõi chuyến
      operationId: getRide
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RideId'}]
      responses:
        '200':
          description: Trạng thái mới nhất của chuyến
          content: {application/json: {schema: {$ref: '#/components/schemas/Ride'}}}
        '403':
          description: Không có quyền xem chuyến
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '404':
          description: Không tìm thấy chuyến
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /rides/{ride_id}/status:
    patch:
      tags: [Rides]
      summary: Cập nhật trạng thái chuyến
      operationId: updateRideStatus
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RideId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RideStatusRequest'}}}
      responses:
        '200':
          description: Cập nhật trạng thái hợp lệ
          content: {application/json: {schema: {$ref: '#/components/schemas/Ride'}}}
        '400':
          description: Dữ liệu trạng thái không hợp lệ
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '403':
          description: Tài xế không được gán cho chuyến
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Chuyển trạng thái không hợp lệ
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /rides/{ride_id}/cancel:
    post:
      tags: [Rides]
      summary: Hủy chuyến
      operationId: cancelRide
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/RideId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CancelRideRequest'}}}
      responses:
        '200':
          description: Hủy chuyến thành công
          content: {application/json: {schema: {$ref: '#/components/schemas/Ride'}}}
        '403':
          description: Không có quyền hủy chuyến
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '409':
          description: Không thể hủy chuyến ở trạng thái hiện tại
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}

    \ |\n\n | Kích hoạt | Customer chọn chức năng đặt xe. |\n\n | Hậu điều kiện thành công | Tạo một \\`Ride\\`, tính giá\
    \ dự kiến và chuyển sang \\`SEARCHING\\_DRIVER\\`. |\n\n | Hậu điều kiện thất bại | Không tạo chuyến hợp lệ; hiển thị\
    \ nguyên nhân để Customer sửa hoặc thoát. |\n\n **\\*\\*Luồng chính:\\*\\***\n\n 1. Customer nhập hoặc chọn điểm đón.\n\
    \n 2. Hệ thống lấy tọa độ từ dịch vụ bản đồ và hiển thị điểm đón.\n\n 3. Customer nhập điểm đến.\n\n 4. Hệ thống tính\
    \ khoảng cách, thời gian và giá dự kiến.\n\n 5. Customer chọn \\`BIKE\\` hoặc \\`CAR\\`, phương thức thanh toán và xác\
    \ nhận.\n\n 6. Hệ thống kiểm tra dữ liệu, chống tạo trùng và tạo \\`Ride\\`.\n\n 7. Hệ thống chuyển sang UC02 để tìm tài\
    \ xế và hiển thị trạng thái cho Customer.\n\n **\\*\\*Luồng thay thế/ngoại lệ:\\*\\***\n\n - A1: Điểm đón hoặc điểm đến\
    \ không xác định được: thông báo lỗi, quay lại bước nhập địa điểm.\n\n - A2: Hai điểm không hợp lệ hoặc trùng nhau: không\
    \ cho xác nhận chuyến.\n\n - A3: Không có loại xe trong khu vực: thông báo và cho phép chọn loại xe khác.\n\n - A4: Customer\
    \ bấm xác nhận nhiều lần: chỉ tạo một \\`Ride\\` theo khóa yêu cầu duy nhất.\n\n - A5: Mất mạng: lưu trạng thái ở máy\
    \ chủ; khi kết nối lại tải trạng thái cuối, không tạo chuyến trùng.\n\n### 11.5. Đặc tả UC02 - Tìm và nhận chuyến\n\n\
     | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC02 - Tìm và nhận chuyến |\n\n | Actor chính | Hệ thống và A02\
    \ Driver |\n\n | Tiền điều kiện | UC01 đã tạo chuyến; Customer chưa hủy; có dữ liệu vị trí tài xế gần nhất. |\n\n | Hậu\
    \ điều kiện thành công | Một Driver được gán; chuyến chuyển sang \\`DRIVER\\_ASSIGNED\\`. |\n\n | Hậu điều kiện thất bại\
    \ | Hết 3 phút hoặc hết danh sách; chuyến chuyển sang \\`NO\\_DRIVER\\`. |\n\n **\\*\\*Luồng chính:\\*\\***\n\n 1. Hệ\
    \ thống lọc Driver có \\`availability\\_status = AVAILABLE\\` trong bán kính 5 km.\n\n 2. Hệ thống lọc tiếp theo loại\
    \ xe Customer chọn.\n\n 3. Nếu Customer bật ưu tiên, hệ thống xếp tài xế có đánh giá cao hơn; sau đó ưu tiên khoảng cách\
    \ gần hơn.\n\n 4. Hệ thống gửi yêu cầu cho tài xế phù hợp; mỗi yêu cầu có thời hạn 30 giây.\n\n 5. Driver chọn nhận chuyến;\
    \ hệ thống khóa chuyến và cập nhật Driver sang trạng thái bận.\n\n 6. Hệ thống thông báo thông tin Driver cho Customer\
    \ và chuyển sang UC03.\n\n **\\*\\*Luồng thay thế/ngoại lệ:\\*\\***\n\n - B1: Driver từ chối hoặc không phản hồi trong\
    \ 30 giây: ghi nhận \\`DECLINED\\`/\\`EXPIRED\\`, gửi Driver tiếp theo.\n\n - B2: Driver mất trạng thái \\`AVAILABLE\\\
    ` trước khi nhận: bỏ qua Driver và tìm lại.\n\n - B3: Không còn Driver phù hợp: tiếp tục tìm đến tối đa 3 phút, sau đó\
    \ báo Customer và đóng ở \\`NO\\_DRIVER\\`.\n\n - B4: Hai yêu cầu cùng tranh một chuyến: chỉ yêu cầu đầu tiên hợp lệ được\
    \ chấp nhận, yêu cầu còn lại nhận lỗi đã có tài xế.\n\n### 11.6. Đặc tả UC03 - Theo dõi chuyến\n\n | Thuộc tính | Nội\
    \ dung |\n\n |---|---|\n\n | Mã/tên | UC03 - Theo dõi chuyến |\n\n | Actor chính | A01 Customer, A02 Driver |\n\n | Tiền\
    \ điều kiện | Có \\`Ride\\` thuộc về actor và actor đã được phân quyền xem. |\n\n | Luồng chính | Hiển thị tài xế/khách,\
    \ biển số, điểm đón, điểm đến, trạng thái và vị trí cập nhật. |\n\n | Hậu điều kiện | Trạng thái hiển thị khớp dữ liệu\
    \ mới nhất trên máy chủ. |\n\n Các trạng thái hợp lệ: \\`SEARCHING\\_DRIVER\\` -> \\`DRIVER\\_ASSIGNED\\` -> \\`DRIVER\\\
    _ARRIVING\\` -> \\`IN\\_PROGRESS\\` -> \\`COMPLETED\\`. Từ \\`SEARCHING\\_DRIVER\\` hoặc \\`DRIVER\\_ASSIGNED\\` có thể\
    \ chuyển sang \\`CANCELLED\\` theo UC06.\n\n### 11.7. Đặc tả UC04 - Thực hiện và hoàn tất chuyến\n\n | Thuộc tính | Nội\
    \ dung |\n\n |---|---|\n\n | Mã/tên | UC04 - Thực hiện và hoàn tất chuyến |\n\n | Actor chính | A02 Driver |\n\n | Tiền\
    \ điều kiện | Driver đã được gán cho Ride. |\n\n | Luồng chính | Driver báo đã đến điểm đón; bắt đầu chuyến khi đón khách;\
    \ di chuyển; chọn hoàn tất khi đến điểm đến. |\n\n | Hậu điều kiện | Lưu quãng đường/thời gian, tính giá cuối và chuyển\
    \ sang UC05. |\n\n | Ngoại lệ | Chỉ Driver được gán mới được đổi trạng thái; không cho hoàn tất khi chưa bắt đầu. |\n\n\
    ### 11.8. Đặc tả UC05 - Thanh toán chuyến\n\n | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC05 - Thanh toán\
    \ chuyến |\n\n | Actor chính | A01 Customer |\n\n | Actor phụ | A05 Payment gateway |\n\n | Tiền điều kiện | UC04 đã hoàn\
    \ tất và hệ thống có giá cuối. |\n\n | Luồng tiền mặt | Customer chọn tiền mặt; hệ thống ghi \\`CASH\\_PENDING\\`; Driver\
    \ xác nhận đã thu tiền; chuyển \\`PAID\\`. |\n\n | Luồng trực tuyến | Hệ thống tạo giao dịch; gateway trả kết quả; callback\
    \ hợp lệ chuyển giao dịch sang \\`PAID\\`. |\n\n | Ngoại lệ | Giao dịch thất bại thì ghi \\`FAILED\\`, thông báo Customer\
    \ và cho phép thử lại hoặc chọn tiền mặt theo chính sách. |\n\n### 11.9. Đặc tả UC06 - Hủy chuyến\n\n | Thuộc tính | Nội\
    \ dung |\n\n |---|---|\n\n | Mã/tên | UC06 - Hủy chuyến |\n\n | Actor chính | Customer hoặc Driver |\n\n | Tiền điều kiện\
    \ | Chuyến chưa ở \\`COMPLETED\\` và người yêu cầu có quyền hủy. |\n\n | Luồng chính | Actor chọn hủy, chọn lý do; hệ\
    \ thống kiểm tra trạng thái, tính phí nếu có, thông báo bên còn lại và chuyển \\`CANCELLED\\`. |\n\n | Ngoại lệ | Không\
    \ cho hủy chuyến đã hoàn tất; nếu Driver hủy thì quay lại UC02 tìm Driver khác trước khi đóng chuyến. |\n\n### 11.10.\
    \ Đặc tả UC07 - Đánh giá tài xế\n\n | Thuộc tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC07 - Đánh giá tài xế |\n\n\
     | Actor chính | A01 Customer |\n\n | Tiền điều kiện | Ride ở \\`COMPLETED\\`; Customer là người đặt chuyến; chưa đánh\
    \ giá Ride này. |\n\n | Luồng chính | Customer chọn 1-5 sao, nhập phản hồi tùy chọn; hệ thống kiểm tra và lưu Rating,\
    \ sau đó cập nhật điểm trung bình Driver. |\n\n | Ngoại lệ | Không cho đánh giá nhiều lần, điểm ngoài 1-5 hoặc đánh giá\
    \ chuyến không thuộc Customer. |\n\n### 11.11. Truy vết liên tục BR - FR - UC\n\n | Business requirement | Functional\
    \ requirements liên quan | Use case thực hiện |\n\n |---|---|---|\n\n | BR01 Đặt chuyến | FR01-FR04 | UC01, UC03 |\n\n\
     | BR02 Tìm và phân công tài xế | FR05-FR09 | UC02 |\n\n | BR03 Quản lý trạng thái chuyến | FR10-FR11 | UC03, UC04, UC06\
    \ |\n\n | BR04 Thanh toán chuyến | FR12-FR13 | UC04, UC05 |\n\n | BR05 Đánh giá và phản hồi | FR14-FR15 | UC07, UC09 |"
ba_checklist:
  system: CAB SYSTEM
  document_type: ba_checklist
  checklist: '### 12.1. Checklist truy vết


    - [ ] Mỗi Business Goal có KPI hoặc kết quả đo được.

    - [ ] Mỗi Business Requirement có FR liên quan.

    - [ ] Mỗi FR được thực hiện bởi ít nhất một Use Case hoặc quy trình hệ thống.

    - [ ] Các luồng chính đều có alternate/exception flow.

    - [ ] Các trạng thái Ride có điều kiện chuyển trạng thái rõ ràng.

    - [ ] Thanh toán có success, failed, retry và đối soát.

    - [ ] Có phân quyền đối với Customer, Driver, Vehicle, vị trí và giao dịch.

    - [ ] Có log/audit cho các sự kiện quan trọng.

    - [ ] Có NFR về hiệu năng, availability, bảo mật, riêng tư, nhất quán, phục hồi và truy vết.

    - [ ] Có ma trận Stakeholder, Business Goal, Requirement/Use Case và Risk ở các phần phù hợp.


    ### 12.2. Những điểm CAB SYSTEM đã bổ sung


    1. Đổi tên hệ thống thành **CAB SYSTEM**.

    2. Các mục lớn dùng số 1, 2, 3... và **không có chữ B đứng trước**; mã BR/FR/UC vẫn giữ để truy vết.

    3. Bổ sung trải nghiệm **trước chuyến - trong chuyến - sau chuyến**.

    4. Bổ sung giá/ước lượng, thông tin Driver/Vehicle, theo dõi vị trí, chia sẻ hành trình, hỗ trợ/khiếu nại và audit.

    5. Mở rộng FR và bổ sung các capability vận hành.

    6. Bổ sung các ma trận BA phù hợp: Stakeholder, Business Goal, Requirement, Risk và Use Case.

    7. Làm rõ timeout, retry, chống tạo trùng, lock Ride, phân quyền và callback thanh toán.

    8. Tách rõ quy tắc **giả định của CAB SYSTEM** khỏi các tính năng tham chiếu từ Grab.


    ### 12.3. Ghi chú nguồn tham chiếu


    Các điểm tham chiếu được đối chiếu với thông tin công khai từ Grab Vietnam về các dịch vụ di chuyển, đặt xe, giá/ước lượng,
    thông tin tài xế, chia sẻ hành trình, GrabNow và xác nhận thanh toán. CAB SYSTEM sử dụng các điểm này làm **benchmark
    nghiệp vụ**, không khẳng định sao chép thuật toán nội bộ của Grab.'
  reference_notes: 'CAB SYSTEM được xây dựng theo hướng benchmark trải nghiệm gọi xe hiện hành của Grab Vietnam: hệ thống
    có nhiều dịch vụ di chuyển 2 bánh/4 bánh; người dùng chọn điểm đến để nhận thông tin ước lượng về giá; sau khi ghép chuyến
    có thông tin tài xế/phương tiện; có theo dõi/chia sẻ hành trình; và có các luồng thanh toán, xác nhận thanh toán và đánh
    giá.


    Các số liệu và business rules cụ thể trong tài liệu (ví dụ bán kính 5 km, timeout 30 giây, tối đa 3 phút) là **giả định
    để đặc tả CAB SYSTEM**, cần được Product Owner/Business Owner xác nhận khi triển khai thực tế.'

  non_functional_requirements: 'Non-functional requirement mô tả **\*\*chất lượng và ràng buộc vận hành\*\*** của hệ thống,
    không mô tả một nghiệp vụ riêng lẻ. Các NFR dưới đây được đặt theo bối cảnh ứng dụng đặt xe thời gian gần thực tế.


     | Mã | Nhóm | Non-functional requirement | Tiêu chí kiểm tra/nghiệm thu |


     |---|---|---|---|


     | NFR01 | Hiệu năng | Màn hình tạo chuyến phải phản hồi nhanh sau khi khách xác nhận điểm đón, điểm đến và loại xe. |
    95% yêu cầu trả kết quả trong không quá 2 giây khi tải bình thường. |


     | NFR02 | Hiệu năng | Yêu cầu tìm tài xế phải được gửi đến nhóm tài xế phù hợp trong thời gian gần thực tế. | 95% yêu
    cầu được gửi trong không quá 5 giây sau khi tạo chuyến. |


     | NFR03 | Tính sẵn sàng | Khách hàng và tài xế có thể sử dụng chức năng đặt/nhận chuyến trong thời gian vận hành. | Availability
    tối thiểu 99,5% mỗi tháng, không tính thời gian bảo trì đã thông báo. |


     | NFR04 | Khả năng mở rộng | Hệ thống xử lý được nhiều khách hàng, tài xế và chuyến đi đồng thời. | Đáp ứng tối thiểu
    1.000 yêu cầu đặt chuyến/phút mà không vượt tiêu chí NFR01. |


     | NFR05 | Bảo mật | Dữ liệu tài khoản, vị trí, giao dịch và thông tin tài xế phải được bảo vệ. | Mật khẩu được băm; truyền
    dữ liệu qua HTTPS; phân quyền theo vai trò; không ghi mật khẩu vào log. |


     | NFR06 | Riêng tư | Chỉ người dùng và nhân viên có quyền mới được xem vị trí/chuyến liên quan. | Kiểm thử phân quyền
    không cho khách xem dữ liệu của khách khác. |


     | NFR07 | Tin cậy và nhất quán | Không được tạo chuyến hoặc thanh toán trùng khi người dùng bấm lại hoặc mất mạng. |
    Cùng một mã yêu cầu chỉ tạo tối đa một chuyến và một giao dịch hợp lệ. |


     | NFR08 | Khả năng phục hồi | Khi một dịch vụ tạm thời lỗi, hệ thống phải lưu yêu cầu và khôi phục trạng thái. | Có retry
    có giới hạn, log lỗi và khôi phục dữ liệu sau sự cố dịch vụ. |


     | NFR09 | Dễ sử dụng | Khách hàng mới có thể hoàn thành việc đặt chuyến mà không cần hướng dẫn trực tiếp. | Người dùng
    hoàn thành luồng đặt xe trong tối đa 5 bước chính trên ứng dụng. |


     | NFR10 | Tương thích | Ứng dụng chạy trên các phiên bản Android/iOS được doanh nghiệp hỗ trợ và API bản đồ/thanh toán.
    | Kiểm thử trên danh sách thiết bị và phiên bản do doanh nghiệp phê duyệt. |


     | NFR11 | Quan sát và truy vết | Các sự kiện tạo chuyến, phân tài xế, thanh toán và lỗi phải có log. | Mỗi sự kiện có
    mã chuyến, thời gian, tác nhân và kết quả; không log dữ liệu nhạy cảm. |


     | NFR12 | Bảo trì | Mã nguồn được chia module và API có tài liệu để đội kỹ thuật vận hành. | Có test tự động cho luồng
    chính và tài liệu API cho các endpoint tích hợp. |'

             int ride\_id FK


             int driver\_id FK


             string status


             datetime sent\_at


             datetime responded\_at


         }


         PAYMENT {


             int payment\_id PK


             int ride\_id FK


             string method


             string status


             decimal amount


             string provider\_transaction\_id


             datetime paid\_at


         }


         RATING {


             int rating\_id PK


             int ride\_id FK


             int customer\_id FK


             int driver\_id FK


             int score


             string comment


             datetime created\_at


         }


     \`\`\`


    ### 9.3. Một số ràng buộc dữ liệu


     - \`phone\` và \`license\_plate\` là duy nhất.


     - \`score\` chỉ nhận giá trị từ 1 đến 5.


     - \`vehicle\_type\` chỉ nhận \`BIKE\` hoặc \`CAR\` trong giai đoạn 1.


     - Một \`RIDE\` chỉ có tối đa một \`PAYMENT\` và một \`RATING\`.


     - \`DRIVER\_REQUEST\` giúp lưu lịch sử từng lần gửi, từ chối và hết hạn; nhờ đó hệ thống không gửi trùng cho cùng một
    tài xế.'

    \    UC08 Quản trị: [0.72, 0.62]\n    UC09 Hỗ trợ: [0.60, 0.74]\n```\n\n### 11.4. Đặc tả UC01 - Đặt chuyến\n\n | Thuộc\
    \ tính | Nội dung |\n\n |---|---|\n\n | Mã/tên | UC01 - Đặt chuyến |\n\n | Actor chính | A01 Customer |\n\n | Actor phụ\
    \ | A06 Map/Location service |\n\n | Mục tiêu | Tạo một yêu cầu di chuyển với điểm đón, điểm đến, loại xe và phương thức\

         ST08 Kỹ thuật: [0.84, 0.76]


         ST09 Quản lý: [0.30, 0.62]


     \`\`\`'
  business_goals: '| Mã | Business goal | Chỉ số kết quả mong đợi |


     |---|---|---|


     | BG01 | Cung cấp dịch vụ đặt chuyến nhanh và đáng tin cậy | Khách hàng tạo được chuyến, nhận trạng thái và tài xế trong
    thời gian ngắn; giảm chuyến bị bỏ sót |


     | BG02 | Cung cấp thanh toán linh hoạt, minh bạch | Hỗ trợ tiền mặt và trực tuyến; lưu được trạng thái giao dịch và đối
    soát được doanh thu |


     | BG03 | Tăng hiệu quả khai thác tài xế | Ưu tiên tài xế đang sẵn sàng, gần khách hàng và phù hợp loại xe |


     | BG04 | Nâng cao an toàn và chất lượng dịch vụ | Có thông tin tài xế/chuyến, đánh giá sau chuyến và lưu vết xử lý sự
    cố |


     **\*\*BG02 - phương thức thanh toán:\*\***


     - Tiền mặt: khách hàng thanh toán trực tiếp cho tài xế sau khi chuyến kết thúc.


     - Trực tuyến: khách hàng thanh toán qua đối tác thanh toán; hệ thống chỉ xác nhận hoàn tất khi nhận được kết quả hợp
    lệ.'
  scope: '### Trong phạm vi giai đoạn 1


     - Đăng ký, đăng nhập và quản lý hồ sơ khách hàng/tài xế.


     - Tài xế cập nhật trạng thái sẵn sàng và vị trí.


     - Khách hàng nhập điểm đón, điểm đến, loại xe và tạo chuyến.


     - Tính giá dự kiến, tìm và gửi yêu cầu cho tài xế trong bán kính 5 km.


     - Tài xế nhận hoặc từ chối chuyến; hệ thống chuyển sang tài xế khác khi cần.


     - Theo dõi trạng thái chuyến: chờ tài xế, đã nhận, đang đi, hoàn tất, hủy.


     - Thanh toán tiền mặt hoặc trực tuyến.


     - Đánh giá sau chuyến, lịch sử chuyến và báo cáo cơ bản.


    ### Ngoài phạm vi giai đoạn 1


     - Giao hàng, đặt đồ ăn và vận chuyển hàng hóa.


     - Thuật toán định giá động phức tạp theo thời tiết hoặc sự kiện.


     - Ví điện tử riêng, chương trình hội viên và khuyến mãi nâng cao.


     - Nhận diện khuôn mặt, camera hành trình và trung tâm hỗ trợ khẩn cấp tích hợp.'
business_requirements:
  system: CAB SYSTEM
  document_type: business_requirements
  business_requirements: "Business requirement (BR) mô tả nhu cầu ở cấp độ nghiệp vụ; mã BR01, BR02... là mã định danh duy\
    \ nhất để truy vết sang các functional requirements (FR).\n\n | Mã | Tên business requirement | Diễn giải |\n\n |---|---|---|\n\
    \n | BR01 | Đặt chuyến | Khách hàng có thể tạo chuyến bằng cách cung cấp điểm đón, điểm đến và loại xe; hệ thống kiểm\
    \ tra dữ liệu và tạo yêu cầu chuyến. |\n\n | BR02 | Tìm và phân công tài xế | Hệ thống tìm các tài xế đang sẵn sàng trong\
    \ bán kính 5 km, gửi yêu cầu theo thứ tự phù hợp và ghi nhận tài xế chấp nhận. |\n\n | BR03 | Quản lý trạng thái chuyến\
    \ | Hệ thống cập nhật và hiển thị các trạng thái từ tạo chuyến đến hoàn tất hoặc hủy chuyến cho các bên liên quan. |\n\
    \n | BR04 | Thanh toán chuyến đi | Khách hàng được chọn tiền mặt hoặc trực tuyến; hệ thống lưu kết quả, trạng thái và\
    \ thông tin đối soát. |\n\n | BR05 | Đánh giá và phản hồi | Khách hàng có thể đánh giá tài xế sau chuyến và gửi phản hồi\
    \ để doanh nghiệp cải thiện chất lượng. |\n\n### 5.1. Business Requirement Priority Matrix\n\n```mermaid\nquadrantChart\n\
    \    title Business Requirement Priority Matrix\n    x-axis \"Độ phức tạp thấp\" --> \"Độ phức tạp cao\"\n    y-axis \"\
    Tác động nghiệp vụ thấp\" --> \"Tác động nghiệp vụ cao\"\n    quadrant-1 \"Lập kế hoạch kỹ\"\n    quadrant-2 \"Ưu tiên\
    \ triển khai\"\n    quadrant-3 \"Có thể để sau\"\n    quadrant-4 \"Tối ưu/đơn giản hóa\"\n    BR01 Đặt chuyến: [0.55,\
    \ 0.95]\n    BR02 Phân tài xế: [0.72, 0.92]\n    BR03 Trạng thái chuyến: [0.48, 0.88]\n    BR04 Thanh toán: [0.68, 0.90]\n\
    \    BR05 Đánh giá: [0.35, 0.62]\n```"
business_process:
  system: CAB SYSTEM
  document_type: business_process
  process: "\\`\\`\\`mermaid\nflowchart TD\n    A([Customer mở CAB SYSTEM]) --> B[Chọn dịch vụ di chuyển]\n    B --> C[Nhập/chọn\
    \ điểm đón]\n    C --> D[Nhập điểm đến]\n    D --> E[Hệ thống xác định tuyến, khoảng cách và ước lượng giá]\n    E -->\
    \ F{Thông tin hợp lệ?}\n    F -- Không --> G[Thông báo lỗi và yêu cầu sửa]\n    G --> C\n    F -- Có --> H[Customer chọn\
    \ loại xe, phương thức thanh toán và xác nhận]\n    H --> I{Có thể tạo Ride?}\n    I -- Không --> J[Thông báo lý do và\
    \ không tạo trùng]\n    J --> Z([Kết thúc])\n    I -- Có --> K[Tạo Ride = SEARCHING_DRIVER]\n    K --> L[Tìm Driver phù\
    \ hợp theo trạng thái, loại xe, vị trí]\n    L --> M{Có Driver phù hợp?}\n    M -- Chưa có --> N[Tiếp tục tìm trong thời\
    \ gian cho phép]\n    N --> O{Còn thời gian tìm?}\n    O -- Có --> L\n    O -- Không --> P[Thông báo NO_DRIVER]\n    P\
    \ --> Z\n    M -- Có --> Q[Gửi yêu cầu cho Driver]\n    Q --> R{Driver nhận trong timeout?}\n    R -- Không --> S[Ghi\
    \ nhận EXPIRED/DECLINED]\n    S --> T{Còn Driver khác?}\n    T -- Có --> Q\n    T -- Không --> N\n    R -- Có --> U[Lock\
    \ Ride và gán Driver]\n    U --> V[Thông báo thông tin Driver cho Customer]\n    V --> W[Driver đến điểm đón]\n    W -->\
    \ X[Chuyến bắt đầu và chuyển IN_PROGRESS]\n    X --> Y[Theo dõi vị trí/trạng thái]\n    Y --> AA[Driver hoàn tất chuyến]\n\
    \    AA --> AB[Tính giá cuối và ghi nhận chuyến COMPLETED]\n    AB --> AC[Thanh toán]\n    AC --> AD[Đánh giá/Phản hồi]\n\
    \    AD --> Z\n\\`\\`\\`\n\n### 6.1. Ma trận trạng thái chuyến\n\n| Trạng thái hiện tại | Sự kiện | Trạng thái kế tiếp\
    \ | Actor |\n|---|---|---|---|\n| `SEARCHING_DRIVER` | Driver nhận | `DRIVER_ASSIGNED` | Driver/System |\n| `SEARCHING_DRIVER`\
    \ | Hết thời gian tìm | `NO_DRIVER` | System |\n| `SEARCHING_DRIVER` | Customer hủy | `CANCELLED` | Customer |\n| `DRIVER_ASSIGNED`\
    \ | Driver đến điểm đón | `DRIVER_ARRIVING` | Driver |\n| `DRIVER_ASSIGNED` | Driver hủy | `SEARCHING_DRIVER` hoặc `CANCELLED`\
    \ | Driver/System |\n| `DRIVER_ARRIVING` | Bắt đầu chuyến | `IN_PROGRESS` | Driver |\n| `DRIVER_ARRIVING` | Hủy hợp lệ\
    \ | `CANCELLED` | Customer/Driver |\n| `IN_PROGRESS` | Driver hoàn tất | `COMPLETED` | Driver |\n| `COMPLETED` | Thanh\
    \ toán thành công | `PAID`/hoàn tất thanh toán | System |"
functional_analysis:
  system: CAB SYSTEM
  document_type: functional_analysis
  functional_requirements: '| Mã FR | Thuộc BR | Functional requirement | Tiêu chí chính |


     |---|---|---|---|


     | FR01 | BR01 | Xác định vị trí khách hàng | Cho phép nhập hoặc chọn điểm đón trên bản đồ. |


     | FR02 | BR01 | Nhập điểm đến | Bắt buộc có điểm đến hợp lệ và khác điểm đón. |


     | FR03 | BR01 | Chọn loại xe | Cho phép chọn xe 2 bánh hoặc 4 bánh. |


     | FR04 | BR01 | Hiển thị giá dự kiến | Tính và hiển thị giá trước khi khách xác nhận. |


     | FR05 | BR02 | Tìm tài xế trong bán kính 5 km | Lọc tài xế theo khoảng cách và trạng thái sẵn sàng. |


     | FR06 | BR02 | Lọc tài xế theo trạng thái | Chỉ chọn tài xế đang online và sẵn sàng nhận chuyến. |


     | FR07 | BR02 | Lọc theo loại xe | Chỉ gửi chuyến cho tài xế có loại xe khách đã chọn. |


     | FR08 | BR02 | Ưu tiên theo đánh giá | Nếu khách có yêu cầu, ưu tiên tài xế có điểm đánh giá cao hơn. |


     | FR09 | BR02 | Gửi và hết hạn yêu cầu | Gửi yêu cầu tuần tự hoặc theo nhóm; quá thời hạn thì chuyển tài xế khác. |


     | FR10 | BR03 | Quản lý trạng thái chuyến | Lưu các trạng thái và chỉ cho phép chuyển trạng thái hợp lệ. |


     | FR11 | BR03 | Thông báo trạng thái | Gửi thông báo khi tài xế nhận, từ chối, đến điểm đón hoặc hoàn tất. |


     | FR12 | BR04 | Thanh toán tiền mặt | Đánh dấu cần thu tiền mặt và hoàn tất khi tài xế xác nhận. |


     | FR13 | BR04 | Thanh toán trực tuyến | Tạo giao dịch, nhận callback và cập nhật thành công/thất bại. |


     | FR14 | BR05 | Đánh giá sau chuyến | Chỉ cho đánh giá sau khi chuyến hoàn tất; điểm từ 1 đến 5. |


     | FR15 | BR05 | Lưu phản hồi | Lưu nội dung phản hồi gắn với chuyến và tài xế. |

    | FR16 | BR03 | Chia sẻ thông tin chuyến | Hiển thị thông tin Driver, Vehicle, biển số và trạng thái; cho phép chia sẻ
    hành trình theo chính sách CAB SYSTEM. |

    | FR17 | BR03 | Theo dõi vị trí | Cập nhật vị trí Driver/Customer theo chu kỳ phù hợp và kiểm soát quyền truy cập. |

    | FR18 | BR04 | Hiển thị phí/phụ phí | Hiển thị giá/ước lượng và các thành phần phí áp dụng theo chính sách. |

    | FR19 | BR05 | Đánh giá hai chiều | Có thể mở rộng để Driver đánh giá Customer sau chuyến. |

    | FR20 | BR05 | Khiếu nại và hỗ trợ | Tạo case hỗ trợ gắn với Ride và lịch sử sự kiện. |


  business_rules_and_exceptions: "### 8.1. Business rules\n\n | Mã | Business rule |\n\n |---|---|\n\n | BRL01 | Chỉ tài xế\
    \ có trạng thái \\`AVAILABLE\\` mới được nhận chuyến. |\n\n | BRL02 | Tài xế phải thuộc đúng loại xe khách đã chọn. |\n\
    \n | BRL03 | Một tài xế không được nhận đồng thời hai chuyến đang hoạt động. |\n\n | BRL04 | Yêu cầu tài xế hết hạn sau\
    \ 30 giây nếu không có phản hồi. |\n\n | BRL05 | Nếu có nhiều tài xế, ưu tiên tài xế gần hơn; khi khách yêu cầu thì ưu\
    \ tiên thêm điểm đánh giá cao. |\n\n | BRL06 | Chỉ chuyến ở trạng thái \\`COMPLETED\\` mới được thanh toán cuối và đánh\
    \ giá. |\n\n | BRL07 | Giao dịch trực tuyến chỉ chuyển sang \\`PAID\\` khi đối tác trả về mã thành công hợp lệ. |\n\n\
     | BRL08 | Giá cuối có thể thay đổi theo quãng đường thực tế nhưng phải được lưu cùng chuyến để đối soát. |\n\n | BRL09\
    \ | Khách hàng có thể hủy khi chưa bắt đầu chuyến; phí hủy áp dụng theo chính sách doanh nghiệp. |\n\n### 8.2. Exception\
    \ và hướng xử lý\n\n | Mã | Tình huống ngoại lệ | Hướng xử lý | Kết thúc |\n\n |---|---|---|---|\n\n | EX01 | Không tìm\
    \ thấy tài xế trong thời gian tối đa 3 phút | Thông báo, cho phép khách thử lại hoặc hủy yêu cầu | Đóng chuyến ở \\`NO\\\
    _DRIVER\\` hoặc \\`CANCELLED\\` |\n\n | EX02 | Tài xế không phản hồi trong 30 giây | Đánh dấu yêu cầu hết hạn, gửi cho\
    \ tài xế kế tiếp | Tiếp tục tìm hoặc kết thúc nếu hết danh sách |\n\n | EX03 | Tài xế đã nhận nhưng hủy trước khi đón\
    \ khách | Giải phóng tài xế, tìm tài xế khác và thông báo khách | Kết thúc khi có tài xế mới hoặc không còn tài xế |\n\
    \n | EX04 | Khách không xác nhận tài xế trong 60 giây | Hủy lượt giữ chỗ và chuyển sang tài xế khác | Kết thúc lượt xác\
    \ nhận hiện tại |\n\n | EX05 | Thanh toán trực tuyến thất bại | Báo lỗi, cho phép thử lại hoặc chuyển sang tiền mặt |\
    \ Đóng giao dịch thất bại, chuyến vẫn chờ thanh toán |\n\n | EX06 | Mất kết nối khi đang đặt chuyến | Lấy lại trạng thái\
    \ cuối từ máy chủ khi kết nối lại | Không tạo chuyến trùng; kết thúc khi đồng bộ xong |\n\n | EX07 | Điểm đón/đến không\
    \ hợp lệ | Hiển thị lỗi và yêu cầu nhập địa điểm khác | Không tạo chuyến |\n\n### 8.3. Risk Matrix\n\n```mermaid\nquadrantChart\n\
    \    title CAB SYSTEM Risk Matrix\n    x-axis \"Khả năng xảy ra thấp\" --> \"Khả năng xảy ra cao\"\n    y-axis \"Mức độ\
    \ tác động thấp\" --> \"Mức độ tác động cao\"\n    quadrant-1 \"Ưu tiên xử lý\"\n    quadrant-2 \"Giám sát và chuẩn bị\"\
    \n    quadrant-3 \"Theo dõi\"\n    quadrant-4 \"Giảm xác suất\"\n    R01 Không tìm Driver: [0.72, 0.78]\n    R02 Thanh\
    \ toán lỗi: [0.58, 0.82]\n    R03 Tạo Ride trùng: [0.40, 0.92]\n    R04 GPS/mất mạng: [0.70, 0.65]\n    R05 Sai phân quyền:\
    \ [0.30, 0.98]\n    R06 Driver hủy sau nhận: [0.62, 0.68]\n```"

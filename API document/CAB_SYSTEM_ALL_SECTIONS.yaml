         Admin[\"A04 System administrator\"]\n\n     Payment[\"A05 Payment gateway\"]\n\n     Map[\"A06 Map/Location service\"\
    ]\n\n     subgraph CABRide[\"CAB SYSTEM\"]\n\n         UC01((\"UC01 Đặt chuyến\"))\n\n         UC02((\"UC02 Tìm và nhận\
    \ chuyến\"))\n\n         UC03((\"UC03 Theo dõi chuyến\"))\n\n         UC04((\"UC04 Thực hiện và hoàn tất chuyến\"))\n\n\
             UC05((\"UC05 Thanh toán chuyến\"))\n\n         UC06((\"UC06 Hủy chuyến\"))\n\n         UC07((\"UC07 Đánh giá\
    \ tài xế\"))\n\n         UC08((\"UC08 Quản lý tài khoản và cấu hình\"))\n\n         UC09((\"UC09 Hỗ trợ và xử lý sự cố\"\
    ))\n\n     end\n\n     Customer --> UC01\n\n     Customer --> UC03\n\n     Customer --> UC05\n\n     Customer --> UC06\n\
    \n     Customer --> UC07\n\n     Driver --> UC02\n\n     Driver --> UC03\n\n     Driver --> UC04\n\n     Driver --> UC06\n\
    \n     Payment --> UC05\n\n     Map --> UC01\n\n     Map --> UC03\n\n     Operations --> UC03\n\n     Operations --> UC09\n\
    \n     Admin --> UC08\n\n     UC01 -. \"include\" .-> UC03\n\n     UC01 -. \"include\" .-> UC02\n\n     UC04 -. \"include\"\
    \ .-> UC05\n\n     UC04 -. \"extend\" .-> UC07\n\n     UC01 -. \"extend\" .-> UC06\n\n \\`\\`\\`\n\n### 11.3. Danh sách\
    \ use case\n\n | Mã | Tên use case | Actor chính | Kết quả thành công |\n\n |---|---|---|---|\n\n | UC01 | Đặt chuyến\
    \ | Customer | Tạo chuyến ở trạng thái \\`SEARCHING\\_DRIVER\\`. |\n\n | UC02 | Tìm và nhận chuyến | Driver | Một tài\
    \ xế phù hợp nhận chuyến ở trạng thái \\`DRIVER\\_ASSIGNED\\`. |\n\n | UC03 | Theo dõi chuyến | Customer, Driver | Hai\
    \ bên xem được trạng thái, vị trí và thông tin chuyến. |\n\n | UC04 | Thực hiện và hoàn tất chuyến | Driver | Chuyến chuyển\

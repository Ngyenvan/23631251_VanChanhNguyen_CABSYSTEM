  use_cases: "### 11.1. Actor và nhóm use case\n\n | Mã actor | Actor | Mô tả |\n\n |---|---|---|\n\n | A01 | Customer (Khách\
    \ hàng) | Tạo chuyến, chọn loại xe, theo dõi chuyến, thanh toán và đánh giá. |\n\n | A02 | Driver (Tài xế) | Cập nhật\
    \ sẵn sàng, nhận/từ chối chuyến, thực hiện và hoàn tất chuyến. |\n\n | A03 | Operations staff | Theo dõi chuyến, hỗ trợ\
    \ khách/tài xế và xử lý khiếu nại. |\n\n | A04 | System administrator | Quản lý tài khoản, tài xế, xe, cấu hình và báo\
    \ cáo. |\n\n | A05 | Payment gateway | Xác nhận hoặc từ chối giao dịch trực tuyến. |\n\n | A06 | Map/Location service\
    \ | Cung cấp bản đồ, tọa độ, khoảng cách và định tuyến. |\n\n Trong tài liệu này, \\`Customer\\` là actor A01; mã \\`UC01\\\
    ` là use case **\\*\\*Đặt chuyến\\*\\*** mà Customer khởi tạo. Một use case là một mục tiêu hoàn chỉnh của actor, còn\
    \ các bước xử lý bên trong được mô tả ở phần đặc tả.\n\n### 11.2. Use case diagram\n\n \\`\\`\\`mermaid\n\n flowchart\

  - name: Ma trận trạng thái chuyến
    content: '### 6.1. Ma trận trạng thái chuyến


      | Trạng thái hiện tại | Sự kiện | Trạng thái kế tiếp | Actor |

      |---|---|---|---|

      | `SEARCHING_DRIVER` | Driver nhận | `DRIVER_ASSIGNED` | Driver/System |

      | `SEARCHING_DRIVER` | Hết thời gian tìm | `NO_DRIVER` | System |

      | `SEARCHING_DRIVER` | Customer hủy | `CANCELLED` | Customer |

      | `DRIVER_ASSIGNED` | Driver đến điểm đón | `DRIVER_ARRIVING` | Driver |

      | `DRIVER_ASSIGNED` | Driver hủy | `SEARCHING_DRIVER` hoặc `CANCELLED` | Driver/System |

      | `DRIVER_ARRIVING` | Bắt đầu chuyến | `IN_PROGRESS` | Driver |

      | `DRIVER_ARRIVING` | Hủy hợp lệ | `CANCELLED` | Customer/Driver |

      | `IN_PROGRESS` | Driver hoàn tất | `COMPLETED` | Driver |

      | `COMPLETED` | Thanh toán thành công | `PAID`/hoàn tất thanh toán | System |'

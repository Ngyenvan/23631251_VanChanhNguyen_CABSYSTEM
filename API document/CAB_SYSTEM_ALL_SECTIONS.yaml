    \ |\n\n | UC09 | Hỗ trợ và xử lý sự cố | Operations staff | Sự cố được ghi nhận, xử lý và có lịch sử truy vết. |\n\n###\
    \ 11.3.1. Use Case Priority Matrix\n\n```mermaid\nquadrantChart\n    title Use Case Priority Matrix\n    x-axis \"Độ phức\

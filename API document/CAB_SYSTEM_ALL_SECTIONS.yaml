    ` hoặc được ghi nhận là tiền mặt cần thu. |\n\n | UC06 | Hủy chuyến | Customer, Driver | Chuyến được hủy theo đúng điều\
    \ kiện và chính sách phí. |\n\n | UC07 | Đánh giá tài xế | Customer | Lưu điểm đánh giá và phản hồi sau chuyến. |\n\n\

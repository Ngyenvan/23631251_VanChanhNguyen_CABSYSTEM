system: CAB SYSTEM
version: "1.0"
document_type: acceptance_criteria
acceptance_criteria:
  - id: AC01
    related: "BR01, FR01-FR04, UC01"
    case: "Tạo chuyến hợp lệ"
    given: "Customer đã đăng nhập và nhập điểm đón, điểm đến hợp lệ."
    when: "Customer chọn BIKE hoặc CAR và xác nhận."
    then: "Hệ thống hiển thị giá dự kiến và tạo đúng một Ride ở SEARCHING_DRIVER."
    result: "Pass khi chuyến được lưu và không tạo bản ghi trùng."
  - id: AC02
    related: "BR01, FR01-FR02, UC01"
    case: "Từ chối địa điểm không hợp lệ"
    given: "Điểm đón và điểm đến trùng hoặc không định vị được."
    when: "Customer xác nhận."
    then: "Hệ thống hiển thị lỗi và không tạo Ride."
    result: "Pass khi không có chuyến hợp lệ được tạo."
  - id: AC03
    related: "BR02, FR05-FR07, UC02"
    case: "Tìm đúng tài xế"
    given: "Driver AVAILABLE, đúng loại xe và trong bán kính 5 km."
    when: "Ride được tạo."
    then: "Hệ thống gửi yêu cầu cho Driver phù hợp."
    result: "Pass khi Driver ngoài bán kính, sai loại xe hoặc không sẵn sàng không nhận được yêu cầu."
  - id: AC04
    related: "BR02, FR08, UC02"
    case: "Ưu tiên tài xế"
    given: "Có nhiều Driver phù hợp."
    when: "Hệ thống thực hiện matching."
    then: "Driver gần hơn được ưu tiên; nếu có yêu cầu thì xét thêm điểm đánh giá."
    result: "Pass khi thứ tự ưu tiên đúng rule."
  - id: AC05
    related: "BR02, FR09, UC02"
    case: "Driver hết thời gian phản hồi"
    given: "Yêu cầu đã gửi cho Driver."
    when: "Driver không phản hồi trong 30 giây."
    then: "Yêu cầu hết hạn và hệ thống chuyển sang Driver phù hợp tiếp theo."
    result: "Pass khi không gửi lại trùng cho cùng Driver."
  - id: AC06
    related: "BR02, FR09, UC02"
    case: "Không tìm được Driver"
    given: "Không còn Driver phù hợp."
    when: "Hệ thống kết thúc thời gian tìm."
    then: "Customer nhận thông báo không tìm được Driver."
    result: "Pass khi Ride không bị gán sai Driver."
  - id: AC07
    related: "BR03, FR10, UC03"
    case: "Chuyển trạng thái hợp lệ"
    given: "Ride đang ở trạng thái hợp lệ."
    when: "Có sự kiện tương ứng."
    then: "Hệ thống chuyển sang trạng thái kế tiếp theo state machine."
    result: "Pass khi không thể chuyển sang trạng thái trái quy tắc."
  - id: AC08
    related: "BR03, FR11, UC03-UC04"
    case: "Thông báo trạng thái"
    given: "Ride thay đổi trạng thái."
    when: "Sự kiện được ghi nhận."
    then: "Customer/Driver nhận thông báo phù hợp."
    result: "Pass khi thông báo đúng người và đúng trạng thái."
  - id: AC09
    related: "BR04, FR12, UC05"
    case: "Thanh toán tiền mặt"
    given: "Ride COMPLETED và phương thức là CASH."
    when: "Driver xác nhận đã thu tiền."
    then: "Payment được ghi nhận thành công."
    result: "Pass khi trạng thái thanh toán được lưu chính xác."
  - id: AC10
    related: "BR04, FR13, UC05"
    case: "Thanh toán trực tuyến thành công"
    given: "Ride COMPLETED và có giao dịch hợp lệ."
    when: "Gateway trả callback thành công."
    then: "Payment chuyển sang PAID."
    result: "Pass khi callback hợp lệ được xử lý."
  - id: AC11
    related: "BR04, FR13, UC05"
    case: "Thanh toán trực tuyến thất bại"
    given: "Gateway trả kết quả thất bại."
    when: "Hệ thống nhận callback."
    then: "Payment chuyển FAILED và Customer được thông báo."
    result: "Pass khi có thể retry hoặc chọn phương thức khác theo policy."
  - id: AC12
    related: "BR03, UC06"
    case: "Hủy chuyến đúng điều kiện"
    given: "Ride chưa COMPLETED."
    when: "Customer hoặc Driver hủy và chọn lý do."
    then: "Hệ thống lưu lý do, tính phí theo policy và thông báo bên còn lại."
    result: "Pass khi không thể hủy Ride đã hoàn tất."
  - id: AC13
    related: "BR05, FR14-FR15, UC07"
    case: "Đánh giá sau chuyến"
    given: "Ride COMPLETED."
    when: "Customer gửi điểm 1-5 và phản hồi."
    then: "Hệ thống lưu Rating và cập nhật điểm Driver."
    result: "Pass khi không thể đánh giá chuyến không thuộc Customer hoặc đánh giá lần hai."
  - id: AC14
    related: "BR01-BR05, UC01-UC05"
    case: "Không tạo dữ liệu trùng"
    given: "Customer xác nhận hoặc callback nhiều lần cho cùng request."
    when: "Hệ thống xử lý request."
    then: "Chỉ có một Ride và một Payment hợp lệ."
    result: "Pass khi idempotency/unique constraint hoạt động."
  - id: AC15
    related: "NFR01-NFR06, NFR09"
    case: "Đáp ứng chất lượng hệ thống"
    given: "Hệ thống chạy kịch bản tải và bảo mật được phê duyệt."
    when: "Đo hiệu năng, phân quyền và khả dụng."
    then: "Kết quả đạt các ngưỡng NFR."
    result: "Pass khi toàn bộ NFR bắt buộc đạt và có báo cáo kiểm thử."

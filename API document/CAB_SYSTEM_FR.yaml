system: CAB SYSTEM
version: "1.0"
document_type: functional_requirements
functional_requirements:
  - id: FR01
    business_requirement: BR01
    name: "Xác định vị trí khách hàng"
    description: "Cho phép nhập hoặc chọn điểm đón trên bản đồ."
  - id: FR02
    business_requirement: BR01
    name: "Nhập điểm đến"
    description: "Bắt buộc có điểm đến hợp lệ và khác điểm đón."
  - id: FR03
    business_requirement: BR01
    name: "Chọn loại xe"
    description: "Cho phép chọn xe 2 bánh hoặc 4 bánh."
  - id: FR04
    business_requirement: BR01
    name: "Hiển thị giá dự kiến"
    description: "Tính và hiển thị giá trước khi khách xác nhận."
  - id: FR05
    business_requirement: BR02
    name: "Tìm tài xế trong bán kính 5 km"
    description: "Lọc tài xế theo khoảng cách và trạng thái sẵn sàng."
  - id: FR06
    business_requirement: BR02
    name: "Lọc tài xế theo trạng thái"
    description: "Chỉ chọn tài xế đang online và sẵn sàng nhận chuyến."
  - id: FR07
    business_requirement: BR02
    name: "Lọc theo loại xe"
    description: "Chỉ gửi chuyến cho tài xế có loại xe khách đã chọn."
  - id: FR08
    business_requirement: BR02
    name: "Ưu tiên theo đánh giá"
    description: "Nếu khách có yêu cầu, ưu tiên tài xế có điểm đánh giá cao hơn."
  - id: FR09
    business_requirement: BR02
    name: "Gửi và hết hạn yêu cầu"
    description: "Gửi yêu cầu tuần tự hoặc theo nhóm; quá thời hạn thì chuyển tài xế khác."
  - id: FR10
    business_requirement: BR03
    name: "Quản lý trạng thái chuyến"
    description: "Lưu các trạng thái và chỉ cho phép chuyển trạng thái hợp lệ."
  - id: FR11
    business_requirement: BR03
    name: "Thông báo trạng thái"
    description: "Gửi thông báo khi tài xế nhận, từ chối, đến điểm đón hoặc hoàn tất."
  - id: FR12
    business_requirement: BR04
    name: "Thanh toán tiền mặt"
    description: "Đánh dấu cần thu tiền mặt và hoàn tất khi tài xế xác nhận."
  - id: FR13
    business_requirement: BR04
    name: "Thanh toán trực tuyến"
    description: "Tạo giao dịch, nhận callback và cập nhật thành công/thất bại."
  - id: FR14
    business_requirement: BR05
    name: "Đánh giá sau chuyến"
    description: "Chỉ cho đánh giá sau khi chuyến hoàn tất; điểm từ 1 đến 5."
  - id: FR15
    business_requirement: BR05
    name: "Lưu phản hồi"
    description: "Lưu nội dung phản hồi gắn với chuyến và tài xế."

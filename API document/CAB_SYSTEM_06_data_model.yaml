data_model_and_erd: '### 9.1. Các thực thể chính


   - \`User\`: tài khoản và thông tin đăng nhập chung.


   - \`Driver\`: hồ sơ tài xế, trạng thái sẵn sàng, vị trí và điểm đánh giá.


   - \`Vehicle\`: phương tiện và loại xe.


   - \`Ride\`: chuyến đi, điểm đón, điểm đến, giá và trạng thái.


   - \`Payment\`: phương thức và kết quả thanh toán.


   - \`DriverRequest\`: từng lượt gửi yêu cầu đến một tài xế.


   - \`Rating\`: đánh giá của khách hàng sau chuyến.


  ### 9.2. ERD


   \`\`\`mermaid


   erDiagram


       USER ||--o| DRIVER : "có hồ sơ"


       DRIVER ||--o{ VEHICLE : "sở hữu"


       USER ||--o{ RIDE : "tạo"


       RIDE ||--o{ DRIVER\_REQUEST : "gửi đến"


       DRIVER ||--o{ DRIVER\_REQUEST : "nhận"


       RIDE ||--o| PAYMENT : "có"


       RIDE ||--o| RATING : "được đánh giá"


       USER ||--o{ RATING : "viết"


       DRIVER ||--o{ RATING : "nhận"


       USER {


           int user\_id PK


           string full\_name


           string phone UK


           string role


           string status


       }


       DRIVER {


           int driver\_id PK


           int user\_id FK


           decimal rating


           string availability\_status


           decimal current\_latitude


           decimal current\_longitude


       }


       VEHICLE {


           int vehicle\_id PK


           int driver\_id FK


           string vehicle\_type


           string license\_plate UK


           string status


       }


       RIDE {


           int ride\_id PK


           int customer\_id FK


           string pickup\_address


           decimal pickup\_latitude


           decimal pickup\_longitude


           string destination\_address


           decimal destination\_latitude


           decimal destination\_longitude


           string vehicle\_type


           decimal estimated\_fare


           decimal final\_fare


           string status


           datetime created\_at


       }


       DRIVER\_REQUEST {


           int request\_id PK


           int ride\_id FK


           int driver\_id FK


           string status


           datetime sent\_at


           datetime responded\_at


       }


       PAYMENT {


           int payment\_id PK


           int ride\_id FK


           string method


           string status


           decimal amount


           string provider\_transaction\_id


           datetime paid\_at


       }


       RATING {


           int rating\_id PK


           int ride\_id FK


           int customer\_id FK


           int driver\_id FK


           int score


           string comment


           datetime created\_at


       }


   \`\`\`


  ### 9.3. Một số ràng buộc dữ liệu


   - \`phone\` và \`license\_plate\` là duy nhất.


   - \`score\` chỉ nhận giá trị từ 1 đến 5.


   - \`vehicle\_type\` chỉ nhận \`BIKE\` hoặc \`CAR\` trong giai đoạn 1.


   - Một \`RIDE\` chỉ có tối đa một \`PAYMENT\` và một \`RATING\`.


   - \`DRIVER\_REQUEST\` giúp lưu lịch sử từng lần gửi, từ chối và hết hạn; nhờ đó hệ thống không gửi trùng cho cùng một tài
  xế.'

openapi: 3.0.3
info: { title: CAB System API - Rating, version: 1.5.0 }
paths:
  /trips/{trip_id}/rating:
    post:
      operationId: rateCompletedTripDriver
      summary: Customer đánh giá Driver sau Trip hoàn thành
      description: Không phụ thuộc Payment thành công. Thang điểm, đánh giá trùng và thời hạn là OI-10.
      x-trace: { fr: [FR-42, FR-56], brule: [BRULE-06] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/RatingRequest' } } } }
      responses:
        '201': { description: Đánh giá đã lưu, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Rating' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không phải Customer của Trip, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Không tìm thấy Trip, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Trip chưa hoàn thành hoặc quy tắc đánh giá không cho phép, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

openapi: 3.0.3
info:
  title: CAB System API - Driver
  version: 1.5.0
  description: Driver profile, availability and recorded location. Dispatch only uses a location newer than 60 seconds.
paths:
  /drivers/me/profile:
    patch:
      operationId: updateDriverProfile
      summary: Driver cập nhật hồ sơ
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Updated Driver }, '403': { $ref: '#/components/responses/Forbidden' } }
  /drivers/me/availability:
    patch:
      operationId: updateDriverAvailability
      summary: Driver tham gia hoặc rời điều phối
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Availability updated } }
  /drivers/me/locations:
    post:
      operationId: recordDriverLocation
      summary: Driver ghi nhận vị trí phục vụ điều phối và ETA
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Location recorded } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

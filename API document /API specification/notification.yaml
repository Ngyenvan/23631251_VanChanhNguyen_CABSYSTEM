openapi: 3.0.3
info:
  title: CAB System API - Notification
  version: 1.5.0
  description: Internal request boundary; delivery failure cannot reverse core business state.
paths:
  /internal/notifications:
    post:
      operationId: requestBusinessNotification
      summary: Source service yêu cầu gửi thông báo tại mốc SRS
      security: [{ bearerAuth: [] }]
      responses: { '202': { description: Notification accepted }, '503': { description: Channel unavailable without business rollback } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

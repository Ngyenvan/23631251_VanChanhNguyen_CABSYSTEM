openapi: 3.0.3
info:
  title: CAB System API - Automatic Dispatch
  version: 1.5.0
  description: Điều phối là trách nhiệm nội bộ CAB System; không có API cho Operations Staff gán Driver thủ công.
paths:
  /bookings/{booking_id}/dispatch-sessions:
    post:
      operationId: startPrimaryDispatch
      summary: CAB System mở phiên điều phối chính
      description: Điểm gọi nội bộ khi Booking được tiếp nhận. Một session tối đa 3 rounds; mỗi round mời đồng thời tối đa 20 Driver hợp lệ chưa được mời, phản hồi trong 20 giây.
      x-trace: { fr: [FR-12, FR-13, FR-14, FR-15, FR-16, FR-17, FR-18, FR-19], brule: [BRULE-10, BRULE-11, BRULE-12] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/BookingId' }]
      responses:
        '202': { description: Phiên PRIMARY đã mở, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DispatchSession' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /dispatch-sessions/{session_id}:
    get:
      operationId: getDispatchSession
      summary: Xem session điều phối
      description: Customer chỉ được xem session của Booking mình; Operations Staff chỉ xem theo quyền. Không có thao tác chọn/gán Driver.
      x-trace: { fr: [FR-20, FR-47, FR-58] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/SessionId' }]
      responses:
        '200': { description: Phiên điều phối, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DispatchSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dispatch-offers/{offer_id}/response:
    post:
      operationId: respondToDispatchOffer
      summary: Driver chấp nhận hoặc từ chối offer còn hiệu lực
      description: Offer hết hạn sau 20 giây. Với accept trong cửa sổ 1 giây, CAB System chọn khoảng cách ngắn nhất theo ảnh chụp vị trí của round; hòa thì theo thời điểm CAB System nhận phản hồi. Các offer còn lại hết hiệu lực.
      x-trace: { fr: [FR-16, FR-17, FR-18, FR-21, FR-40], brule: [BRULE-10, BRULE-11] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/OfferId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/OfferResponseRequest' } } } }
      responses:
        '200': { description: Phản hồi và trạng thái offer được ghi nhận, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DispatchOffer' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không có quyền truy cập session/offer, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Không tìm thấy tài nguyên, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Offer/session không còn hợp lệ hoặc thao tác lặp mâu thuẫn, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

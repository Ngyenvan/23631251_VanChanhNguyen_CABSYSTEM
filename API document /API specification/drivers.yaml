openapi: 3.0.3
info: { title: CAB System API - Driver, version: 1.5.0 }
paths:
  /drivers/me/profile:
    patch:
      operationId: updateDriverProfile
      summary: Driver cập nhật hồ sơ
      x-trace: { fr: [FR-06, FR-56] }
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DriverProfileRequest' } } } }
      responses:
        '200': { description: Hồ sơ Driver, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Driver' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/me/vehicle:
    patch:
      operationId: updateDriverVehicle
      summary: Driver cập nhật phương tiện
      x-trace: { fr: [FR-07, FR-56] }
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/VehicleRequest' } } } }
      responses:
        '200': { description: Phương tiện đã cập nhật, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Driver' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/me/availability:
    patch:
      operationId: updateDriverAvailability
      summary: Driver tham gia hoặc rời điều phối
      description: Trạng thái sẵn sàng không tự làm Driver hợp lệ nếu còn Trip đang thực hiện hoặc vị trí quá 60 giây.
      x-trace: { fr: [FR-08, FR-09], brule: [BRULE-12] }
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DriverAvailabilityRequest' } } } }
      responses:
        '200': { description: Trạng thái Driver, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Driver' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/me/locations:
    post:
      operationId: recordDriverLocation
      summary: Driver gửi vị trí
      description: Điều phối chỉ dùng vị trí được ghi nhận không quá 60 giây.
      x-trace: { fr: [FR-10], brule: [BRULE-12] }
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DriverLocationRequest' } } } }
      responses:
        '201': { description: Vị trí được lưu }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không đúng vai trò Driver, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

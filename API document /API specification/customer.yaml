openapi: 3.0.3
info:
  title: CAB System API - Customer
  version: 1.5.0
  description: Customer Profile service; does not own Booking, Trip or Payment.
paths:
  /customers/me:
    get:
      operationId: getCustomerProfile
      summary: Customer xem profile của mình
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Customer profile }, '401': { $ref: '#/components/responses/Unauthorized' } }
    patch:
      operationId: updateCustomerProfile
      summary: Customer cập nhật profile của mình
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Updated profile }, '403': { $ref: '#/components/responses/Forbidden' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

openapi: 3.0.3
info:
  title: CAB System API - Audit
  version: 1.5.0
  description: Immutable audit entries for important decisions/actions, queried only under permission.
paths:
  /audit-entries:
    get:
      operationId: listAuditEntries
      summary: Operations Staff tra cứu audit theo quyền
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Audit entries }, '403': { $ref: '#/components/responses/Forbidden' } }
  /internal/audit-entries:
    post:
      operationId: recordAuditableFact
      summary: Source service ghi nhận fact audit đã xảy ra
      security: [{ bearerAuth: [] }]
      responses: { '202': { description: Audit fact accepted } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

openapi: 3.0.3
info:
  title: CAB System API - Vehicle
  version: 1.5.0
  description: Vehicle service owns vehicle information and Driver-Vehicle relation.
paths:
  /drivers/me/vehicle:
    patch:
      operationId: updateDriverVehicle
      summary: Driver cập nhật phương tiện
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Vehicle updated }, '403': { $ref: '#/components/responses/Forbidden' } }
  /operations/vehicles:
    get:
      operationId: listOperationalVehicles
      summary: Operations Staff tra cứu phương tiện theo quyền
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Vehicle list }, '403': { $ref: '#/components/responses/Forbidden' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

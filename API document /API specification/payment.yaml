openapi: 3.0.3
info:
  title: CAB System API - Payment
  version: 1.5.0
  description: Customer selects payment after Fare; cash confirmation and electronic finalization are idempotent.
paths:
  /trips/{trip_id}/payments:
    post:
      operationId: selectTripPaymentMethod
      summary: Customer chọn CASH hoặc ELECTRONIC sau Trip hoàn thành
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Payment created }, '409': { $ref: '#/components/responses/Conflict' } }
  /payments/{payment_id}/cash-confirmation:
    post:
      operationId: confirmCashReceipt
      summary: Driver của Trip xác nhận CASH
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/PaymentId' }]
      responses: { '200': { description: Cash confirmed }, '403': { $ref: '#/components/responses/Forbidden' } }
  /payments/{payment_id}/retry:
    post:
      operationId: retryElectronicPayment
      summary: Customer xử lý lại ELECTRONIC thất bại trên cùng Trip theo chính sách ABC
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/PaymentId' }]
      responses: { '202': { description: Electronic retry accepted }, '409': { $ref: '#/components/responses/Conflict' } }
  /payments/provider-callback:
    post:
      operationId: receiveElectronicPaymentResult
      summary: Provider gửi kết quả ELECTRONIC; chỉ một kết quả cuối được ghi nhận
      security: [{ paymentProviderAuth: [] }]
      responses: { '200': { description: Result recorded or duplicate acknowledged }, '409': { $ref: '#/components/responses/Conflict' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

openapi: 3.0.3
info:
  title: CAB System API - Authentication
  version: 1.5.0
  description: Hợp đồng tài khoản theo SRS v1.5. Không cố định định dạng định danh, mật khẩu hoặc ma trận quyền còn mở tại OI-08/OI-18.
paths:
  /auth/register:
    post:
      operationId: registerAccount
      summary: Đăng ký Customer hoặc Driver tự đăng ký
      x-trace: { fr: [FR-01, FR-04], br: [BR-01, BR-02] }
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/RegisterRequest' } } }
      responses:
        '201': { description: Tài khoản được tạo, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      operationId: loginAccount
      summary: Xác thực Customer hoặc Driver
      x-trace: { fr: [FR-02, FR-56], brule: [BRULE-01] }
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: Xác thực thành công, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/LoginResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Xung đột nghiệp vụ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

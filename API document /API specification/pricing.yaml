openapi: 3.0.3
info:
  title: CAB System API - Pricing
  version: 1.5.0
  description: Final fare is determined only after Trip completion; fare policy remains open.
paths:
  /trips/{trip_id}/fare:
    get:
      operationId: getTripFare
      summary: Customer xem Fare của Trip hoàn thành
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }]
      responses: { '200': { description: Fare }, '409': { $ref: '#/components/responses/Conflict' } }
  /internal/trips/{trip_id}/fare:
    post:
      operationId: calculateCompletedTripFare
      summary: CAB System xác định Fare sau trip.completed
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }]
      responses: { '200': { description: Fare calculated }, '409': { $ref: '#/components/responses/Conflict' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

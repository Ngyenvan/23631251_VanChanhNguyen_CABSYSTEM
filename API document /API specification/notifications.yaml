openapi: 3.0.3
info: { title: CAB System API - Notification, version: 1.5.0 }
paths:
  /internal/notifications:
    post:
      operationId: requestBusinessNotification
      summary: CAB System yêu cầu gửi thông báo nghiệp vụ
      description: Bao phủ đúng các mốc FR-35 đến FR-40. Lỗi kênh thông báo không được đảo ngược trạng thái Booking, Trip, Dispatch Session hoặc Payment; kênh/retry là OI-12.
      x-trace: { fr: [FR-35, FR-36, FR-37, FR-38, FR-39, FR-40] }
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/NotificationRequest' } } } }
      responses:
        '202': { description: Yêu cầu thông báo đã được tiếp nhận, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Notification' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Chỉ CAB System được yêu cầu thông báo nội bộ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unavailable: { description: Kênh thông báo tạm không khả dụng; không được trả kết quả nghiệp vụ giả, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

openapi: 3.0.3
info: { title: CAB System API - Reporting, version: 1.5.0 }
paths:
  /reports/activity:
    get:
      operationId: getActivityReport
      summary: Khai thác báo cáo Trip và điều phối tự động
      description: Cung cấp số Trip, số Dispatch Session, doanh thu, tỷ lệ hoàn thành/hủy, hiệu quả Driver và tỷ lệ xác nhận/no-driver/retry/recovery. Công thức/kỳ báo cáo là OI-09.
      x-trace: { fr: [FR-51, FR-52, FR-53, FR-54, FR-55] }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Báo cáo hoạt động, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ActivityReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không có quyền khai thác báo cáo, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unavailable: { description: Dữ liệu báo cáo tạm không khả dụng, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

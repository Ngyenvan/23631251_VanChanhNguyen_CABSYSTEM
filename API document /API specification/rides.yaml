openapi: 3.0.3
info:
  title: CAB System Final API - rides
  version: 1.0-final
  description: Target API baseline derived from Phase 1-4 evidence. Every operation has x-trace UC/FR/BR. Unconfirmed fare
    formula, matching criteria, timeout value, cancellation policy, payment retry policy, rating scale, login identifier and
    other open issues are intentionally not hard-coded.
servers:
- url: https://api.cabsystem.example.com/v1
  description: Logical target base URL [TECHNICAL DESIGN]
tags:
- name: trip-service
  description: '[TECHNICAL DESIGN] service boundary'
paths:
  /rides:
    post:
      tags:
      - trip-service
      summary: Tạo yêu cầu đặt chuyến
      operationId: createRide
      description: Modified existing contract. Payment method, pre-trip estimate and high-rating preference are removed from
        baseline booking input.
      x-service: trip-service
      x-trace:
        uc:
        - UC04
        fr:
        - FR04
        - FR05
        - FR06
        - FR07
        br:
        - BR01
        - BR06
        - BR11
      x-classification: '[TECHNICAL DESIGN]'
      responses:
        '201':
          description: Chuyến được tạo ở trạng thái tìm tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột trạng thái nghiệp vụ hoặc idempotency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dependency/service tạm thời không khả dụng; không được chuyển thành kết quả nghiệp vụ giả
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      x-authorization:
        actors_or_callers:
        - CUSTOMER
        note: '[TECHNICAL DESIGN] Authorization documentation derived from UC actors/BR16; exact role matrix remains subject
          to approved access policy.'
    get:
      tags:
      - trip-service
      summary: Xem lịch sử chuyến của khách hàng
      operationId: listCustomerRides
      description: '[TECHNICAL DESIGN] Phase 5 target REST contract. Business trace is carried in x-trace.'
      x-service: trip-service
      x-trace:
        uc:
        - UC12
        fr:
        - FR34
        - FR35
        br:
        - BR10
        - BR12
      x-classification: '[TECHNICAL DESIGN]'
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideList'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      x-authorization:
        actors_or_callers:
        - CUSTOMER
        note: '[TECHNICAL DESIGN] Authorization documentation derived from UC actors/BR16; exact role matrix remains subject
          to approved access policy.'
  /rides/{ride_id}:
    get:
      tags:
      - trip-service
      summary: Xem chi tiết và trạng thái chuyến
      operationId: getRide
      description: '[TECHNICAL DESIGN] Phase 5 target REST contract. Business trace is carried in x-trace.'
      x-service: trip-service
      x-trace:
        uc:
        - UC07
        fr:
        - FR18
        - FR24
        br:
        - BR06
        - BR07
      x-classification: '[TECHNICAL DESIGN]'
      responses:
        '200':
          description: Chi tiết chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      x-authorization:
        actors_or_callers:
        - CUSTOMER
        - DRIVER
        note: '[TECHNICAL DESIGN] Authorization documentation derived from UC actors/BR16; exact role matrix remains subject
          to approved access policy.'
  /rides/{ride_id}/status:
    patch:
      tags:
      - trip-service
      summary: Cập nhật trạng thái chuyến bởi tài xế được gán
      operationId: updateRideStatus
      description: Modified existing contract. Final fare/distance are not accepted from driver; FR25 is owned by Pricing.
        Invalid transition returns 409.
      x-service: trip-service
      x-trace:
        uc:
        - UC07
        fr:
        - FR20
        - FR21
        - FR22
        - FR23
        br:
        - BR06
        - BR11
      x-classification: '[TECHNICAL DESIGN]'
      responses:
        '200':
          description: Chuyến sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thực hiện thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy tài nguyên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột trạng thái nghiệp vụ hoặc idempotency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideStatusUpdateRequest'
      x-authorization:
        actors_or_callers:
        - DRIVER
        note: '[TECHNICAL DESIGN] Authorization documentation derived from UC actors/BR16; exact role matrix remains subject
          to approved access policy.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication mechanism is technical design; exact role/permission matrix remains subject to approved
        authorization policy.
    paymentSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: Provider callback authenticity mechanism [TECHNICAL DESIGN]; concrete provider/signing algorithm is not
        selected.
  parameters:
    RideId:
      name: ride_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: '[TECHNICAL DESIGN] Repeat of same key+same payload should return the same logical result; same key with
        different payload returns 409.'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ
        details:
          type: object
          additionalProperties: true
          nullable: true
        correlation_id:
          type: string
          nullable: true
          description: '[TECHNICAL DESIGN] optional diagnostic correlation value.'
    PageMeta:
      type: object
      required:
      - page
      - limit
      - total
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    Location:
      type: object
      required:
      - address
      - latitude
      - longitude
      properties:
        address:
          type: string
          minLength: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    User:
      type: object
      required:
      - user_id
      - full_name
      - role
      - status
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          description: Current source roles include CUSTOMER/DRIVER/OPERATIONS/ADMIN; exact authorization policy remains open.
        status:
          type: string
    RegisterRequest:
      type: object
      required:
      - full_name
      - login_identifier
      - password
      - role
      properties:
        full_name:
          type: string
          minLength: 1
        login_identifier:
          type: string
          minLength: 1
          description: '[OPEN ISSUE] Canonical login identifier is not yet confirmed (Excel username vs current API phone).'
        password:
          type: string
          format: password
          minLength: 1
          description: No password-length policy is promoted from existing API/Test assumptions.
        role:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
          description: Self-registration scope from current contract; operations-created driver branch remains unresolved.
    LoginRequest:
      type: object
      required:
      - login_identifier
      - password
      properties:
        login_identifier:
          type: string
          minLength: 1
          description: '[OPEN ISSUE] username vs phone must be confirmed.'
        password:
          type: string
          format: password
          minLength: 1
    LoginResponse:
      type: object
      required:
      - access_token
      - token_type
      - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
    DriverProfileRequest:
      type: object
      required:
      - vehicle_type
      - license_plate
      properties:
        vehicle_type:
          type: string
          minLength: 1
          description: Vehicle-type catalog is not fixed by customer requirement.
        license_plate:
          type: string
          minLength: 1
    Driver:
      type: object
      required:
      - driver_id
      - availability_status
      properties:
        driver_id:
          type: integer
        full_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        availability_status:
          type: string
          enum:
          - AVAILABLE
          - OFFLINE
          - BUSY
          description: '[TECHNICAL DESIGN] status vocabulary retained from existing API.'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Vehicle:
      type: object
      properties:
        vehicle_id:
          type: integer
        vehicle_type:
          type: string
        license_plate:
          type: string
        vehicle_status:
          type: string
          nullable: true
    DriverAvailabilityRequest:
      type: object
      required:
      - availability_status
      properties:
        availability_status:
          type: string
          enum:
          - AVAILABLE
          - OFFLINE
          - BUSY
    DriverLocationRequest:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        recorded_at:
          type: string
          format: date-time
          nullable: true
    DriverLocation:
      allOf:
      - $ref: '#/components/schemas/DriverLocationRequest'
      - type: object
        required:
        - location_id
        - driver_id
        properties:
          location_id:
            type: integer
          driver_id:
            type: integer
    CreateRideRequest:
      type: object
      required:
      - pickup
      - destination
      - vehicle_type
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
          minLength: 1
          description: Required by BR01/FR04; catalog is extensible and not hard-coded.
    Ride:
      type: object
      required:
      - ride_id
      - customer_id
      - pickup
      - destination
      - vehicle_type
      - status
      - created_at
      properties:
        ride_id:
          type: integer
        customer_id:
          type: integer
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
        status:
          type: string
          enum:
          - SEARCHING_DRIVER
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - PASSENGER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - NO_DRIVER
          description: Lifecycle derived from FR17/FR20-FR24. Cancellation omitted from baseline because policy is OPEN ISSUE.
        assigned_driver_id:
          type: integer
          nullable: true
        eta_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: FR18 requires ETA; calculation method not specified.
        fare_amount:
          type: number
          nullable: true
          minimum: 0
          description: Final amount after FR25; fare formula is OPEN ISSUE.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    RideList:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
    RideStatusUpdateRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - DRIVER_ARRIVED
          - PASSENGER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
    DispatchStartResponse:
      type: object
      required:
      - ride_id
      - matching_status
      properties:
        ride_id:
          type: integer
        matching_status:
          type: string
          enum:
          - SEARCHING
          - NO_DRIVER
          - DRIVER_ASSIGNED
        current_request_id:
          type: integer
          nullable: true
        note:
          type: string
          nullable: true
          description: No radius/timeout value is returned as approved business policy.
    DriverRequestDecisionRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - ACCEPTED
          - DECLINED
    DriverRequestResult:
      type: object
      required:
      - request_id
      - ride_id
      - decision
      - ride_status
      properties:
        request_id:
          type: integer
        ride_id:
          type: integer
        decision:
          type: string
          enum:
          - ACCEPTED
          - DECLINED
        ride_status:
          type: string
          enum:
          - DRIVER_ASSIGNED
          - SEARCHING_DRIVER
    FinalFareResponse:
      type: object
      required:
      - ride_id
      - amount
      - currency
      properties:
        ride_id:
          type: integer
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          example: VND
        calculated_at:
          type: string
          format: date-time
    CreatePaymentRequest:
      type: object
      required:
      - method
      properties:
        method:
          type: string
          enum:
          - CASH
          - ONLINE
          description: Customer-confirmed baseline payment forms. Future methods are covered by FR44.
    Payment:
      type: object
      required:
      - payment_id
      - ride_id
      - method
      - status
      - amount
      properties:
        payment_id:
          type: integer
        ride_id:
          type: integer
        method:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - PAID
          - FAILED
        amount:
          type: number
          minimum: 0
        provider_reference:
          type: string
          nullable: true
        checkout_url:
          type: string
          format: uri
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
    PaymentCallbackRequest:
      type: object
      required:
      - payment_id
      - result
      - amount
      properties:
        payment_id:
          type: integer
        provider_reference:
          type: string
          nullable: true
        result:
          type: string
          enum:
          - SUCCESS
          - FAILED
        amount:
          type: number
          minimum: 0
    PaymentList:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    NotificationRequest:
      type: object
      required:
      - recipient_type
      - recipient_id
      - type
      properties:
        trip_id:
          type: integer
          nullable: true
        recipient_type:
          type: string
          enum:
          - CUSTOMER
          - DRIVER
        recipient_id:
          type: integer
        type:
          type: string
          enum:
          - BOOKING_RECEIVED
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - TRIP_COMPLETED
          - PAYMENT_RESULT
          - DRIVER_NEW_TRIP
          - TRIP_CHANGED
          description: Notification moments grounded in BR11/FR31-FR33.
        message_data:
          type: object
          additionalProperties: true
          nullable: true
          description: Presentation payload; must not contain payment credentials.
    Notification:
      type: object
      required:
      - notification_id
      - status
      properties:
        notification_id:
          type: integer
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
        sent_at:
          type: string
          format: date-time
          nullable: true
    RatingRequest:
      type: object
      required:
      - score
      properties:
        score:
          type: number
          description: '[OPEN ISSUE] Rating scale/range is not customer-confirmed; current API 1-5 is MBB/technical evidence
            only.'
        comment:
          type: string
          nullable: true
    Rating:
      allOf:
      - $ref: '#/components/schemas/RatingRequest'
      - type: object
        required:
        - rating_id
        - ride_id
        - driver_id
        properties:
          rating_id:
            type: integer
          ride_id:
            type: integer
          driver_id:
            type: integer
          created_at:
            type: string
            format: date-time
    CustomerSummary:
      type: object
      properties:
        customer_id:
          type: integer
        full_name:
          type: string
        account_status:
          type: string
    DriverSummary:
      type: object
      properties:
        driver_id:
          type: integer
        full_name:
          type: string
        availability_status:
          type: string
    VehicleSummary:
      type: object
      properties:
        vehicle_id:
          type: integer
        driver_id:
          type: integer
        vehicle_type:
          type: string
        license_plate:
          type: string
        vehicle_status:
          type: string
    RideSummary:
      type: object
      properties:
        ride_id:
          type: integer
        customer_id:
          type: integer
        driver_id:
          type: integer
          nullable: true
        status:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
    GenericPagedCustomers:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerSummary'
    GenericPagedDrivers:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverSummary'
    GenericPagedVehicles:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleSummary'
    GenericPagedRides:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/RideSummary'
    RideSupportContext:
      type: object
      required:
      - ride
      properties:
        ride:
          $ref: '#/components/schemas/RideSummary'
        driver:
          $ref: '#/components/schemas/DriverSummary'
        payment:
          $ref: '#/components/schemas/Payment'
    AuditLog:
      type: object
      required:
      - audit_id
      - action_type
      - target_type
      - target_id
      - created_at
      properties:
        audit_id:
          type: integer
        operator_id:
          type: integer
          nullable: true
        action_type:
          type: string
        target_type:
          type: string
        target_id:
          type: integer
        action_detail:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AuditLogList:
      type: object
      required:
      - page
      - limit
      - total
      - items
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        items:
          type: array

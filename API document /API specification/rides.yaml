openapi: 3.0.3
info:
  title: CAB System API - Booking and Trip
  version: 1.5.0
  description: File giữ tên cũ rides.yaml nhưng API phân biệt rõ Booking với Trip theo SRS v1.5.
paths:
  /bookings:
    post:
      operationId: createBooking
      summary: Customer gửi Booking và mở phiên điều phối chính tự động
      x-trace: { fr: [FR-11, FR-12, FR-20, FR-35], brule: [BRULE-10] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/BookingInput' } } } }
      responses:
        '201': { description: Booking và phiên chính đã mở, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Booking' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listCustomerTrips
      summary: Customer xem lịch sử Trip
      x-trace: { fr: [FR-29, FR-41, FR-56] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/Page' }, { $ref: './common.yaml#/components/parameters/Limit' }]
      responses:
        '200': { description: Lịch sử Trip, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/PagedResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bookings/{booking_id}:
    get:
      operationId: getBooking
      summary: Xem trạng thái Booking, Driver xác nhận và thời gian đến
      x-trace: { fr: [FR-20, FR-21, FR-22, FR-56] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/BookingId' }]
      responses:
        '200': { description: Booking, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Booking' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: reviseBookingForRetry
      summary: Customer sửa điểm đón, điểm đến hoặc loại xe trước retry
      description: Chỉ hợp lệ sau khi phiên thất bại và trước khi Customer gửi retry; không tự mở phiên mới.
      x-trace: { fr: [FR-19, FR-56], brule: [BRULE-13] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/BookingId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/BookingInput' } } } }
      responses:
        '200': { description: Booking đã sửa, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Booking' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{booking_id}/retry:
    post:
      operationId: retryBookingDispatch
      summary: Customer mở phiên retry trên Booking hiện có
      description: Bị từ chối trước thời điểm retry_available_at; hệ thống mở phiên RETRY mới sau đúng thời gian khóa 10 giây.
      x-trace: { fr: [FR-19, FR-20], brule: [BRULE-13] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/BookingId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Phiên retry đã mở, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DispatchSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /bookings/{booking_id}/cancellation:
    post:
      operationId: cancelBookingOrPrePickupTrip
      summary: Customer hủy khi Booking đang điều phối hoặc Trip chưa đón Customer
      description: Khi điều phối, CAB System thu hồi offer; khi Driver đã xác nhận, CAB System thông báo Driver. Sau mốc PICKED_UP_CUSTOMER trả về 409. Không suy diễn phí/hệ quả OI-04.
      x-trace: { fr: [FR-60, FR-58], brule: [BRULE-15] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/BookingId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Hủy được ghi nhận, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Cancellation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /trips/{trip_id}:
    get:
      operationId: getTrip
      summary: Customer hoặc Driver xem Trip thuộc mình
      x-trace: { fr: [FR-23, FR-29, FR-56] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }]
      responses:
        '200': { description: Trip, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Trip' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /trips/{trip_id}/status:
    patch:
      operationId: updateTripStatus
      summary: Driver cập nhật mốc thực hiện Trip
      description: Chỉ Driver đã xác nhận thực hiện Trip được cập nhật theo trình tự ARRIVED_AT_PICKUP, PICKED_UP_CUSTOMER, IN_PROGRESS, COMPLETED.
      x-trace: { fr: [FR-23, FR-24, FR-25, FR-26, FR-27, FR-37, FR-38, FR-40] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/TripStatusRequest' } } } }
      responses:
        '200': { description: Trip sau cập nhật, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Trip' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /trips/{trip_id}/cannot-serve:
    post:
      operationId: reportDriverCannotServe
      summary: Driver báo không thể phục vụ trước pickup
      description: CAB System tự mở tối đa một phiên RECOVERY, loại Driver này; không có thao tác gán tay của Operations Staff.
      x-trace: { fr: [FR-49, FR-59], brule: [BRULE-14] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DriverCannotServeRequest' } } } }
      responses:
        '202': { description: Xử lý phục hồi đã được mở hoặc ghi nhận là không còn đủ điều kiện, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/DispatchSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không có quyền trên Booking/Trip này, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Không tìm thấy Booking hoặc Trip, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Trạng thái hiện tại không cho phép thao tác, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

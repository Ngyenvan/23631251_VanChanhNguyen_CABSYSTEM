openapi: 3.0.3
info:
  title: CAB System API - Dispatch
  version: 1.5.0
  description: Automatic Dispatch only: 3 rounds, at most 20 eligible Drivers per round, 20-second offers and 1-second concurrent-accept selection.
paths:
  /internal/bookings/{booking_id}/dispatch-sessions:
    post:
      operationId: startDispatchSession
      summary: CAB System bắt đầu PRIMARY, RETRY hoặc RECOVERY session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/BookingId' }]
      responses: { '202': { description: Session started }, '409': { $ref: '#/components/responses/Conflict' } }
  /dispatch-sessions/{session_id}:
    get:
      operationId: getDispatchSession
      summary: Customer hoặc Operations Staff xem session theo quyền
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/SessionId' }]
      responses: { '200': { description: Dispatch session }, '403': { $ref: '#/components/responses/Forbidden' } }
  /dispatch-offers/{offer_id}/response:
    post:
      operationId: respondToDispatchOffer
      summary: Driver ACCEPT hoặc DECLINE offer còn hiệu lực
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/OfferId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Response recorded }, '409': { $ref: '#/components/responses/Conflict' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

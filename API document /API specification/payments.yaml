openapi: 3.0.3
info: { title: CAB System API - Payment, version: 1.5.0 }
paths:
  /trips/{trip_id}/payments:
    post:
      operationId: selectTripPaymentMethod
      summary: Customer chọn tiền mặt hoặc thanh toán điện tử sau Trip hoàn thành
      x-trace: { fr: [FR-28, FR-29, FR-30, FR-31, FR-34, FR-39] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/PaymentSelectionRequest' } } } }
      responses:
        '201': { description: Giao dịch đã tạo; CASH chờ Driver xác nhận, ELECTRONIC chờ Provider, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Payment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /trips/{trip_id}/payments/{payment_id}/cash-confirmation:
    post:
      operationId: confirmCashReceipt
      summary: Driver xác nhận đã nhận tiền mặt
      description: Chỉ Driver của Trip và chỉ giao dịch CASH chờ xác nhận mới được xác nhận. Bằng chứng/chi tiết xác nhận là OI-17.
      x-trace: { fr: [FR-30, FR-39] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }, { $ref: './common.yaml#/components/parameters/PaymentId' }, { $ref: './common.yaml#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Tiền mặt đã được Driver xác nhận, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Payment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/provider-callback:
    post:
      operationId: receiveElectronicPaymentResult
      summary: External Payment Provider gửi kết quả điện tử
      description: CAB System chỉ ghi nhận một kết quả cuối cùng mỗi giao dịch. Callback trùng cùng kết quả trả lại trạng thái đã lưu; callback muộn mâu thuẫn không đổi kết quả cuối cùng.
      x-trace: { fr: [FR-31, FR-32, FR-33, FR-39, FR-58] }
      security: [{ paymentProviderAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ProviderCallbackRequest' } } } }
      responses:
        '200': { description: Kết quả đã được ghi nhận hoặc callback trùng cùng kết quả, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Payment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/ProviderUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments:
    get:
      operationId: listPaymentsForOperations
      summary: Operations Staff tra cứu lịch sử giao dịch
      x-trace: { fr: [FR-50, FR-57] }
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/Page' }, { $ref: './common.yaml#/components/parameters/Limit' }]
      responses:
        '200': { description: Danh sách giao dịch, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/PagedResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' }
    paymentProviderAuth: { $ref: './common.yaml#/components/securitySchemes/paymentProviderAuth' }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    ProviderUnauthorized: { description: Không xác thực được Provider, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không đúng Customer, Driver của Trip hoặc Operations Staff, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Không tìm thấy Payment/Trip, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Trip chưa hoàn thành, phương thức/trạng thái không hợp lệ hoặc kết quả cuối cùng mâu thuẫn, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

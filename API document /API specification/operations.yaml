openapi: 3.0.3
info:
  title: CAB System API - Operations
  version: 1.5.0
  description: Operations Staff manages and supports within granted rights; manual Driver assignment is absent.
paths:
  /operations/customers:
    get: { operationId: listOperationalCustomers, summary: Tra cứu Customer, security: [{ bearerAuth: [] }], responses: { '200': { description: Customers }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /operations/drivers:
    get: { operationId: listOperationalDrivers, summary: Tra cứu Driver và độ mới vị trí, security: [{ bearerAuth: [] }], responses: { '200': { description: Drivers } } }
  /operations/vehicles:
    get: { operationId: listOperationalVehicles, summary: Tra cứu phương tiện, security: [{ bearerAuth: [] }], responses: { '200': { description: Vehicles } } }
  /operations/trips:
    get: { operationId: listOperationalTrips, summary: Giám sát Trip và session liên quan, security: [{ bearerAuth: [] }], responses: { '200': { description: Trips } } }
  /operations/trips/{trip_id}/support-context:
    get: { operationId: getTripSupportContext, summary: Xem ngữ cảnh hỗ trợ Trip lỗi, security: [{ bearerAuth: [] }], parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }], responses: { '200': { description: Support context } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

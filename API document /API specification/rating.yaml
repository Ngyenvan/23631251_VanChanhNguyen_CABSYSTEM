openapi: 3.0.3
info:
  title: CAB System API - Rating
  version: 1.5.0
  description: Rating belongs to a completed Trip and is independent of electronic payment success.
paths:
  /trips/{trip_id}/rating:
    post:
      operationId: rateCompletedTripDriver
      summary: Customer đánh giá Driver sau Trip hoàn thành
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: './common.yaml#/components/parameters/TripId' }]
      responses: { '201': { description: Rating created }, '409': { $ref: '#/components/responses/Conflict' } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    paymentProviderAuth: { type: http, scheme: bearer }
  schemas:
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ }
    Unauthorized: { description: Chưa xác thực }
    Forbidden: { description: Không có quyền }
    NotFound: { description: Không tìm thấy tài nguyên }
    Conflict: { description: Xung đột trạng thái hoặc thao tác lặp }

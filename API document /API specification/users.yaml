openapi: 3.0.3
info: { title: CAB System API - Customer account, version: 1.5.0 }
paths:
  /users/me:
    get:
      operationId: getCurrentAccount
      summary: Xem tài khoản hiện tại
      x-trace: { fr: [FR-02, FR-56] }
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tài khoản, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCustomerAccount
      summary: Customer cập nhật thông tin cá nhân
      x-trace: { fr: [FR-03, FR-56], brule: [BRULE-01] }
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/UpdateAccountRequest' } } }
      responses:
        '200': { description: Tài khoản đã cập nhật, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes: { bearerAuth: { $ref: './common.yaml#/components/securitySchemes/bearerAuth' } }
  responses:
    BadRequest: { description: Dữ liệu không hợp lệ, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Chưa xác thực, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Không đúng vai trò Customer, content: { application/json: { schema: { $ref: './common.yaml#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cơ chế token là thiết kế kỹ thuật; quyền thực tế phải tuân theo FR-56 và FR-57.
    paymentProviderAuth:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: Xác thực callback của External Payment Provider; thuật toán cụ thể là OI-17.
  parameters:
    BookingId:
      name: booking_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    TripId:
      name: trip_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    OfferId:
      name: offer_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: Cùng khóa và cùng nội dung trả về cùng kết quả nghiệp vụ; cùng khóa nhưng nội dung khác trả về 409.
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true, nullable: true }
        correlation_id: { type: string, nullable: true }
    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address: { type: string, minLength: 1 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    Account:
      type: object
      required: [user_id, full_name, role, status]
      properties:
        user_id: { type: integer }
        full_name: { type: string }
        login_identifier: { type: string, nullable: true, description: Chi tiết định danh là OI-18. }
        role: { type: string, description: Vai trò được kiểm soát theo FR-56/FR-57. }
        status: { type: string }
    RegisterRequest:
      type: object
      required: [full_name, login_identifier, password, role]
      properties:
        full_name: { type: string, minLength: 1 }
        login_identifier: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 1 }
        role: { type: string, enum: [CUSTOMER, DRIVER] }
    LoginRequest:
      type: object
      required: [login_identifier, password]
      properties:
        login_identifier: { type: string, minLength: 1 }
        password: { type: string, format: password, minLength: 1 }
    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        user: { $ref: '#/components/schemas/Account' }
    UpdateAccountRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      description: Các trường được phép cập nhật là OI-18; không suy diễn định dạng hoặc chính sách độc nhất.
    DriverProfileRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      description: Hồ sơ Driver; danh mục trường cụ thể là OI-18.
    VehicleRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      description: Phương tiện Driver; danh mục loại xe là OI-15.
    DriverAvailabilityRequest:
      type: object
      required: [availability_status]
      properties:
        availability_status:
          type: string
          description: Tập trạng thái chi tiết là OI-14. Chỉ trạng thái sẵn sàng cùng điều kiện FR-09 được dùng cho điều phối.
    DriverLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        recorded_at: { type: string, format: date-time, nullable: true }
    Driver:
      type: object
      required: [driver_id, availability_status]
      properties:
        driver_id: { type: integer }
        full_name: { type: string, nullable: true }
        availability_status: { type: string }
        has_active_trip: { type: boolean }
        last_location_at: { type: string, format: date-time, nullable: true }
        vehicle: { type: object, additionalProperties: true, nullable: true }
    BookingInput:
      type: object
      required: [pickup, destination, vehicle_type]
      properties:
        pickup: { $ref: '#/components/schemas/Location' }
        destination: { $ref: '#/components/schemas/Location' }
        vehicle_type: { type: string, minLength: 1, description: Danh mục loại xe là OI-15. }
    Booking:
      type: object
      required: [booking_id, customer_id, pickup, destination, vehicle_type, status, created_at]
      properties:
        booking_id: { type: integer }
        customer_id: { type: integer }
        pickup: { $ref: '#/components/schemas/Location' }
        destination: { $ref: '#/components/schemas/Location' }
        vehicle_type: { type: string }
        status:
          type: string
          description: Nhãn kỹ thuật cho trạng thái §7.2, gồm đang điều phối, chờ/sẵn sàng thử lại, có Driver, điều phối phục hồi, không có Driver và đã hủy.
        current_dispatch_session_id: { type: integer, nullable: true }
        confirmed_driver_id: { type: integer, nullable: true }
        retry_available_at: { type: string, format: date-time, nullable: true, description: Chỉ được đặt sau thất bại và muộn hơn thời điểm thất bại 10 giây. }
        trip_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    Trip:
      type: object
      required: [trip_id, booking_id, driver_id, status]
      properties:
        trip_id: { type: integer }
        booking_id: { type: integer }
        driver_id: { type: integer }
        status: { type: string, description: Đã nhận chuyến, đã đến, đã đón, đang di chuyển hoặc hoàn thành theo §7.2. }
        eta_to_pickup: { type: string, nullable: true, description: Phương pháp ước tính là OI-19. }
        fare_amount: { type: number, nullable: true, minimum: 0 }
    TripStatusRequest:
      type: object
      required: [event]
      properties:
        event: { type: string, enum: [ARRIVED_AT_PICKUP, PICKED_UP_CUSTOMER, IN_PROGRESS, COMPLETED] }
    DispatchSession:
      type: object
      required: [session_id, booking_id, session_type, status, max_rounds, response_window_seconds]
      properties:
        session_id: { type: integer }
        booking_id: { type: integer }
        session_type: { type: string, enum: [PRIMARY, RETRY, RECOVERY] }
        status: { type: string }
        max_rounds: { type: integer, enum: [3] }
        max_drivers_per_round: { type: integer, enum: [20] }
        response_window_seconds: { type: integer, enum: [20] }
        simultaneous_window_seconds: { type: integer, enum: [1] }
        selected_driver_id: { type: integer, nullable: true }
        excluded_driver_id: { type: integer, nullable: true, description: Bắt buộc loại Driver báo không thể phục vụ khỏi phiên phục hồi. }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
    DispatchOffer:
      type: object
      required: [offer_id, session_id, round_number, driver_id, expires_at, status]
      properties:
        offer_id: { type: integer }
        session_id: { type: integer }
        round_number: { type: integer, minimum: 1, maximum: 3 }
        driver_id: { type: integer }
        expires_at: { type: string, format: date-time }
        status: { type: string, description: Còn hiệu lực, đã từ chối, hết hiệu lực hoặc được chọn. }
    OfferResponseRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [ACCEPTED, DECLINED] }
    DriverCannotServeRequest:
      type: object
      additionalProperties: false
      description: Báo trước mốc đã đón Customer. Không quy định lý do hoặc bằng chứng vì SRS chưa nêu.
    Cancellation:
      type: object
      required: [booking_id, cancelled_at]
      properties:
        booking_id: { type: integer }
        trip_id: { type: integer, nullable: true }
        cancelled_at: { type: string, format: date-time }
        financial_effect: { nullable: true, description: Phí/hệ quả tài chính là OI-04. }
    PaymentSelectionRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [CASH, ELECTRONIC] }
    Payment:
      type: object
      required: [payment_id, trip_id, method, status, amount]
      properties:
        payment_id: { type: integer }
        trip_id: { type: integer }
        method: { type: string }
        status: { type: string, description: Tiền mặt chờ Driver xác nhận; điện tử chờ kết quả/thành công/thất bại. }
        amount: { type: number, minimum: 0 }
        provider_reference: { type: string, nullable: true }
        final_result: { type: string, nullable: true, description: Chỉ có một kết quả cuối cùng cho một giao dịch điện tử. }
    ProviderCallbackRequest:
      type: object
      required: [payment_id, result]
      properties:
        payment_id: { type: integer }
        provider_reference: { type: string, nullable: true }
        result: { type: string, enum: [SUCCESS, FAILED] }
    NotificationRequest:
      type: object
      required: [recipient_type, recipient_id, type]
      properties:
        recipient_type: { type: string, enum: [CUSTOMER, DRIVER] }
        recipient_id: { type: integer }
        booking_id: { type: integer, nullable: true }
        trip_id: { type: integer, nullable: true }
        dispatch_session_id: { type: integer, nullable: true }
        type:
          type: string
          enum: [BOOKING_RECEIVED, DRIVER_CONFIRMED, NO_DRIVER, RECOVERY_STARTED, DRIVER_ARRIVED, TRIP_COMPLETED, PAYMENT_RESULT, DISPATCH_OFFER, DISPATCH_OFFER_EXPIRED, ACTIVE_TRIP_CHANGED]
        message_data: { type: object, additionalProperties: true, nullable: true }
    Notification:
      type: object
      required: [notification_id, status]
      properties:
        notification_id: { type: integer }
        status: { type: string }
    RatingRequest:
      type: object
      required: [score]
      properties:
        score: { type: number, description: Thang điểm là OI-10. }
        comment: { type: string, nullable: true }
    Rating:
      type: object
      required: [rating_id, trip_id, driver_id, score]
      properties:
        rating_id: { type: integer }
        trip_id: { type: integer }
        driver_id: { type: integer }
        score: { type: number }
    PagedResult:
      type: object
      required: [page, limit, total, items]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        items: { type: array, items: { type: object, additionalProperties: true } }
    AuditLog:
      type: object
      required: [audit_id, action_type, target_type, target_id, created_at]
      properties:
        audit_id: { type: integer }
        action_type: { type: string }
        target_type: { type: string }
        target_id: { type: integer }
        action_detail: { type: object, additionalProperties: true, nullable: true }
        created_at: { type: string, format: date-time }
    ActivityReport:
      type: object
      required: [trip_count, dispatch_session_count, revenue, completion_rate, cancellation_rate, dispatch_metrics]
      properties:
        trip_count: { type: integer, minimum: 0 }
        dispatch_session_count: { type: integer, minimum: 0 }
        revenue: { type: number, minimum: 0 }
        completion_rate: { type: number, minimum: 0, maximum: 1 }
        cancellation_rate: { type: number, minimum: 0, maximum: 1 }
        driver_effectiveness: { type: array, items: { type: object, additionalProperties: true } }
        dispatch_metrics:
          type: object
          required: [confirmation_rate, no_driver_rate, retry_rate, recovery_rate]
          properties:
            confirmation_rate: { type: number, minimum: 0, maximum: 1 }
            no_driver_rate: { type: number, minimum: 0, maximum: 1 }
            retry_rate: { type: number, minimum: 0, maximum: 1 }
            recovery_rate: { type: number, minimum: 0, maximum: 1 }

openapi: 3.0.3
info: { title: CAB System Shared Contract, version: 1.5.0 }
components:
  parameters:
    BookingId: { name: booking_id, in: path, required: true, schema: { type: string } }
    TripId: { name: trip_id, in: path, required: true, schema: { type: string } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: string } }
    OfferId: { name: offer_id, in: path, required: true, schema: { type: string } }
    PaymentId: { name: payment_id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
  schemas:
    BookingInput: { type: object, required: [pickup, destination, vehicle_type], properties: { pickup: { type: object }, destination: { type: object }, vehicle_type: { type: string } } }
    TripStatus: { type: string, enum: [ARRIVED_AT_PICKUP, PICKED_UP_CUSTOMER, IN_PROGRESS, COMPLETED] }
    PaymentMethod: { type: string, enum: [CASH, ELECTRONIC] }
    OfferDecision: { type: string, enum: [ACCEPT, DECLINE] }
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
